---
# ============================================================================
# dc1.azure — AAP Configuration as Code entry point
# ============================================================================
# Canonical install path for every dc1.azure AAP object. Reads the controller_*
# data structures under files/ and applies them via the upstream
# `infra.aap_configuration.dispatch` role, then verifies the result.
#
# AUTH — self-managing token dance (no stored token required):
#   This play mints a short-lived WRITE token from AAP_CONTROLLER_USERNAME/
#   PASSWORD, uses it for the whole apply + validate run, and deletes it in an
#   always: block — mirroring playbooks/provision_vm.yml et al. A stored
#   AAP_TOKEN can therefore never go stale and 401. If you DO export AAP_TOKEN
#   (e.g. a UI-minted token for an SSO/MFA AAP where username/password minting
#   is blocked), it is used as-is and left untouched. See tasks/aap_token_*.yml.
#
# Prerequisites (see README.md + Phase 7 install docs):
#   - AAP reachable
#   - AAP_CONTROLLER_USERNAME / AAP_CONTROLLER_PASSWORD exported (mints the token)
#   - Azure Service Principal, ADO PAT, Windows admin creds, vault password
#     exported as env vars (see group_vars/all.yml)
#   - collections installed:  ansible-galaxy collection install -r requirements.yml
#
# Run (with log capture so failures are reviewable without re-running):
#   source docs/dev-environment.sh && \
#   ansible-playbook -i aap_config/inventory/ aap_config/load.yml 2>&1 \
#     | tee /tmp/load-$(date +%Y%m%d-%H%M%S).log
#
# Re-running is idempotent — every object is keyed by name.
# ============================================================================

- name: Apply + validate dc1.azure AAP configuration
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    cac_token_scope: write
  vars_files:
    - files/gateway_settings.yml
    - files/controller_settings.yml              # Automation Analytics / Insights (Automation Calculator)
    - files/gateway_organizations.yml
    - files/gateway_teams.yml
    - files/gateway_users.yml                    # Phase 9: Self-Service Portal demo users
    - files/gateway_role_user_assignments.yml    # Phase 9: org-admin + team membership
    - files/eda_projects.yml
    - files/eda_credentials.yml                  # Phase 8: EDA inbound creds
    - files/eda_event_streams.yml                # Phase 8: ServiceNow event stream
    - files/eda_rulebook_activations.yml         # Phase 8: rulebook activation
    - files/controller_credential_types.yml
    - files/controller_credentials.yml
    - files/controller_projects.yml
    - files/controller_inventories.yml
    - files/hub_ee_registries.yml               # Hub remote registry (quay.io)
    - files/hub_ee_repositories.yml             # Hub EE repo + sync trigger
    - files/controller_execution_environments.yml  # Controller EE registration
    - files/controller_job_templates.yml
    - files/controller_workflow_job_templates.yml
    - files/controller_role_team_assignments.yml   # Phase 9: team Execute on the workflow
    - files/controller_schedules.yml            # Nightly teardown schedule
  tasks:
    - name: Apply + validate under a managed CaC token
      block:
        - name: Acquire a write token (or adopt a supplied AAP_TOKEN)
          ansible.builtin.import_tasks: tasks/aap_token_acquire.yml

        # AB#140: the dispatch role's eda_rulebook_activations sub-role fails
        # with "Activation is not in disabled mode and in stopped status" when
        # re-applying against a running activation. Disable it first (no-op on
        # a fresh env where it doesn't exist yet), then re-enable after dispatch.
        - name: Disable the EDA rulebook activation (if it exists) before re-apply
          ansible.eda.rulebook_activation:
            name: "{{ eda_rulebook_activation_name }}"
            organization_name: "{{ my_organization }}"
            controller_host: "{{ aap_hostname }}"
            controller_token: "{{ aap_token }}"
            validate_certs: "{{ aap_validate_certs }}"
            state: disabled
          register: _eda_disable_result
          failed_when: false

        - name: Apply all dc1.azure AAP objects
          ansible.builtin.include_role:
            name: infra.aap_configuration.dispatch

        - name: Re-enable the EDA rulebook activation after re-apply
          ansible.eda.rulebook_activation:
            name: "{{ eda_rulebook_activation_name }}"
            organization_name: "{{ my_organization }}"
            controller_host: "{{ aap_hostname }}"
            controller_token: "{{ aap_token }}"
            validate_certs: "{{ aap_validate_certs }}"
            state: enabled
          when:
            - _eda_disable_result is defined
            - not (_eda_disable_result.failed | default(false))

        # Phase 9 (AB#107): grant the Developers team Execute on the self-service
        # JOB templates jr-dev may run from the portal (launcher + facts). Done here
        # (not via dispatch — the dispatcher omits the controller_* role assignment
        # roles) and AFTER dispatch so the JTs exist even on a fresh env. Their ids
        # are env-specific, so resolve them at runtime.
        - name: Resolve the Phase 9 self-service JT ids (team Execute grants)
          ansible.builtin.uri:
            url: "{{ aap_hostname }}/api/controller/v2/job_templates/?name={{ item | urlencode }}"
            method: GET
            headers:
              Authorization: "Bearer {{ aap_token }}"
            validate_certs: "{{ aap_validate_certs }}"
          loop:
            - "{{ launcher_template }}"
            - "{{ facts_template }}"
          register: dc1_ss_jt_lookups

        - name: Set the JT id facts (empty for any JT that does not exist yet)
          ansible.builtin.set_fact:
            dc1_launcher_jt_id: "{{ dc1_ss_jt_lookups.results[0].json.results[0].id if (dc1_ss_jt_lookups.results[0].json.results | length > 0) else '' }}"
            dc1_facts_jt_id: "{{ dc1_ss_jt_lookups.results[1].json.results[0].id if (dc1_ss_jt_lookups.results[1].json.results | length > 0) else '' }}"

        - name: Grant the Developers team Execute on the self-service JTs (Phase 9)
          ansible.builtin.include_role:
            name: infra.aap_configuration.controller_role_team_assignments

        - name: Verify dc1.azure AAP objects exist
          ansible.builtin.import_tasks: validate_tasks.yml
      always:
        - name: Release the CaC token (only if we minted it)
          ansible.builtin.import_tasks: tasks/aap_token_release.yml
