---
# Consumed by the infra.aap_configuration.credential_types role.
# Custom credential types. Sourced from aap.as.code — ServiceNow ITSM only.
controller_credential_types:
  - name: "DC1.Azure - Windows Admin Password"
    description: >-
      Injects dc1_azure_windows_admin_password as an extra var so the Provision
      VM JT can pass the Windows admin password to Terraform without a survey.
    inputs:
      fields:
        - id: dc1_azure_windows_admin_password
          type: string
          label: Windows Admin Password
          secret: true
          help_text: "12–72 chars, Azure complexity: upper + lower + digit + symbol"
      required:
        - dc1_azure_windows_admin_password
    injectors:
      extra_vars:
        dc1_azure_windows_admin_password: !unsafe '{{dc1_azure_windows_admin_password}}'

  - name: "DC1.Azure - Demo Account Password"
    description: >-
      Injects default_passwd as an extra var so the Provision Access JT can
      create the demo user accounts (devops, ansible-svc) without a survey prompt.
    inputs:
      fields:
        - id: default_passwd
          type: string
          label: Demo Account Password
          secret: true
          help_text: "Password for the devops and ansible-svc accounts created on the Windows VM"
      required:
        - default_passwd
    injectors:
      extra_vars:
        default_passwd: !unsafe '{{default_passwd}}'

  - name: "DC1.Azure - Dynatrace"
    description: >-
      Injects DT_API_HOST (Dynatrace SaaS tenant URL), DT_PAAS_TOKEN
      (OneAgent installer download token), and optionally DT_API_TOKEN
      (classic access token for Problems API v2) as environment variables.
    inputs:
      fields:
        - id: dt_api_host
          type: string
          label: Dynatrace API Host
          help_text: "https://<env-id>.live.dynatrace.com"
        - id: dt_paas_token
          type: string
          label: Dynatrace PaaS Token
          secret: true
          help_text: "OneAgent installer download token from Dynatrace UI"
        - id: dt_api_token
          type: string
          label: Dynatrace API Token
          secret: true
          help_text: >-
            Classic access token (dt0c01.*) with problems.read scope.
            Required for Problems API v2 queries (root cause analysis).
            Generate in Dynatrace UI: Settings > Access tokens.
      required:
        - dt_api_host
        - dt_paas_token
    injectors:
      env:
        DT_API_HOST: !unsafe '{{dt_api_host}}'
        DT_PAAS_TOKEN: !unsafe '{{dt_paas_token}}'
        DT_API_TOKEN: !unsafe '{{dt_api_token}}'

  - name: ServiceNow ITSM Credential
    description: ServiceNow ITSM Credential
    inputs:
      fields:
        - id: instance
          type: string
          label: Instance
        - id: username
          type: string
          label: username
        - id: password
          type: string
          label: password
          secret: true
      required:
        - instance
        - username
        - password
    injectors:
      env:
        SN_HOST: !unsafe '{{instance}}'
        SN_PASSWORD: !unsafe '{{password}}'
        SN_USERNAME: !unsafe '{{username}}'
