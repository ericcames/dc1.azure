---
# Consumed by the infra.aap_configuration.controller_settings role.
# Platform-wide Controller settings. Sourced from aap.as.code's
# controller_settings.yml, adapted to dc1.azure conventions:
#   - secrets resolve from env vars at runtime (group_vars/all.yml), never committed
#   - service-account auth only (client ID/secret), per Red Hat's current guidance
#
# PURPOSE — turn on Automation Analytics / Insights so the **Automation
# Calculator** (ROI / planner on console.redhat.com) has data to chart. AAP
# gathers job-run telemetry and uploads it to console.redhat.com on a schedule;
# the calculator reads that uploaded data. Authentication to console is via a
# Red Hat **service account** (client ID + client secret), NOT a portal
# username/password.
#
# NOTE — these are PLATFORM-WIDE settings (like gateway_settings.yml), not
# `DC1.Azure -` namespaced objects. On an AAP shared with demo.datacenter there
# is a single analytics identity; whichever repo loads last is authoritative.
#
# OPERATIONAL — enabling tracking is necessary but not sufficient for a live
# demo: the calculator only shows data AFTER (1) at least one analytics upload
# has run (default gather interval is 4h; force one from the UI under
# Settings → Subscription, or via `awx-manage gather_analytics --ship`) and
# (2) some job templates have actually run to generate telemetry.
controller_settings:
  settings:
    # Master switch: gather analytics locally and ship to console.redhat.com.
    INSIGHTS_TRACKING_STATE: true
    # Service-account auth (client ID/secret). The legacy portal
    # username/password fields are explicitly cleared so the service account is
    # the single, unambiguous analytics identity (avoids precedence conflicts on
    # a shared AAP). SUBSCRIPTIONS_CLIENT_SECRET is write-only — AAP returns
    # $encrypted$ on read.
    REDHAT_USERNAME: ""
    REDHAT_PASSWORD: ""
    SUBSCRIPTIONS_CLIENT_ID: "{{ redhat_subscriptions_client_id }}"
    SUBSCRIPTIONS_CLIENT_SECRET: "{{ redhat_subscriptions_client_secret }}"
    # When a workflow node's limit resolves to zero hosts (e.g. os_type=linux
    # makes the windemo group empty), Ansible's default is to error. This
    # setting changes it to a warning so the job succeeds as a no-op and the
    # workflow can converge cleanly.
    AWX_TASK_ENV:
      ANSIBLE_HOST_PATTERN_MISMATCH: warning
