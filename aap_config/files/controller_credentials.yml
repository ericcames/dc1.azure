---
# Consumed by the infra.aap_configuration.controller_credentials role.
# Eight credentials the dc1.azure demo needs. Inputs come from env-var lookups
# in group_vars/all.yml — no secrets here.
controller_credentials:
  - name: "{{ cred_vault }}"
    organization: "{{ my_organization }}"
    credential_type: Vault
    inputs:
      vault_password: "{{ vault_password }}"

  - name: "{{ cred_azure_rm }}"
    organization: "{{ my_organization }}"
    credential_type: Microsoft Azure Resource Manager
    inputs:
      subscription: "{{ azure_subscription_id }}"
      tenant: "{{ azure_tenant_id }}"
      client: "{{ azure_client_id }}"
      secret: "{{ azure_client_secret }}"

  - name: "{{ cred_ado_scm }}"
    # ADO PATs authenticate as the basic-auth password; the username can be any
    # non-empty value. AAP uses this to sync the DC1.Azure project over HTTPS.
    organization: "{{ my_organization }}"
    credential_type: Source Control
    inputs:
      username: "{{ ado_username }}"
      password: "{{ ado_pat }}"

  - name: "{{ cred_windows }}"
    # WinRM admin for the provisioned Windows VM. Connection transport details
    # (winrm/5986) live on the `windemo` inventory group, not the credential.
    # The password MUST match what Terraform sets at VM-create time (see
    # provision_vm.yml's dc1_azure_windows_admin_password).
    organization: "{{ my_organization }}"
    credential_type: Machine
    inputs:
      username: "{{ windows_admin_username }}"
      password: "{{ windows_admin_password }}"

  - name: "{{ cred_linux }}"
    # SSH key auth for the provisioned Linux VM. The public key is injected into
    # the VM by Terraform; the private key here lets AAP (and the user's laptop)
    # connect over SSH. Both sourced from dev-environment.sh.
    organization: "{{ my_organization }}"
    credential_type: Machine
    inputs:
      username: "{{ linux_admin_username }}"
      ssh_key_data: "{{ linux_ssh_private_key }}"

  - name: "{{ cred_controller }}"
    # Red Hat AAP credential — injects CONTROLLER_* env vars so provision_vm.yml
    # and teardown.yml can register/deregister the VM in the dc1-azure inventory
    # via the controller API (mirrors the aap.dailydemo.windows inventory role).
    organization: "{{ my_organization }}"
    credential_type: Red Hat Ansible Automation Platform
    inputs:
      host: "{{ controller_cred_host }}"
      username: "{{ controller_cred_username }}"
      password: "{{ controller_cred_password }}"
      verify_ssl: false

  - name: "{{ cred_win_admin_password }}"
    # Custom credential that injects dc1_azure_windows_admin_password as an
    # extra var for the Provision VM JT, so Terraform gets the admin password
    # without a workflow survey prompt. Value matches cred_windows above.
    organization: "{{ my_organization }}"
    credential_type: "DC1.Azure - Windows Admin Password"
    inputs:
      dc1_azure_windows_admin_password: "{{ windows_admin_password }}"

  - name: "{{ cred_demo_account_password }}"
    # Custom credential — injects default_passwd extra var for the Provision Access
    # JT so demo user accounts (devops, ansible-svc) are created without a survey
    # prompt. Value sourced from DC1_AZURE_DEFAULT_PASSWD in dev-environment.sh.
    organization: "{{ my_organization }}"
    credential_type: "DC1.Azure - Demo Account Password"
    inputs:
      default_passwd: "{{ dc1_azure_default_passwd }}"

  - name: "{{ cred_servicenow }}"
    # ServiceNow ITSM credential (Phase 8 outbound) — injects SN_HOST/SN_USERNAME/
    # SN_PASSWORD env vars for the callback/CMDB/incident JTs (playbooks/servicenow/*).
    # Type defined in controller_credential_types.yml; inputs from dev-environment.sh.
    organization: "{{ my_organization }}"
    credential_type: "ServiceNow ITSM Credential"
    inputs:
      instance: "{{ servicenow_instance }}"
      username: "{{ servicenow_username }}"
      password: "{{ servicenow_password }}"

  - name: "{{ cred_hub_registry }}"
    # Container Registry credential — Controller uses it to pull DC1.Azure - EE
    # from the internal Private Automation Hub registry (host = ah_hostname)
    # instead of reaching out to quay.io at job-run time. Attached to the EE in
    # controller_execution_environments.yml.
    organization: "{{ my_organization }}"
    credential_type: Container Registry
    inputs:
      host: "{{ hub_registry_host }}"
      username: "{{ hub_registry_username }}"
      password: "{{ hub_registry_password }}"
      verify_ssl: false
