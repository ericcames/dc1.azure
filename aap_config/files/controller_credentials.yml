---
# Consumed by the infra.aap_configuration.controller_credentials role.
# Four credentials the dc1.azure demo needs. Inputs come from env-var lookups
# in group_vars/all.yml — no secrets here.
controller_credentials:
  - name: "{{ cred_vault }}"
    organization: "{{ my_organization }}"
    credential_type: Vault
    inputs:
      vault_password: "{{ vault_password }}"

  - name: "{{ cred_azure_rm }}"
    organization: "{{ my_organization }}"
    credential_type: Microsoft Azure Resource Manager
    inputs:
      subscription: "{{ azure_subscription_id }}"
      tenant: "{{ azure_tenant_id }}"
      client: "{{ azure_client_id }}"
      secret: "{{ azure_client_secret }}"

  - name: "{{ cred_ado_scm }}"
    # ADO PATs authenticate as the basic-auth password; the username can be any
    # non-empty value. AAP uses this to sync the DC1.Azure project over HTTPS.
    organization: "{{ my_organization }}"
    credential_type: Source Control
    inputs:
      username: "{{ ado_username }}"
      password: "{{ ado_pat }}"

  - name: "{{ cred_windows }}"
    # WinRM admin for the provisioned Windows VM. Connection transport details
    # (winrm/5986) live on the `windows` inventory group, not the credential.
    organization: "{{ my_organization }}"
    credential_type: Machine
    inputs:
      username: "{{ windows_admin_username }}"
      password: "{{ windows_admin_password }}"
