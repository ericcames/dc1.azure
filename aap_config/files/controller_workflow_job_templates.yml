---
# Consumed by the infra.aap_configuration.controller_workflow_job_templates
# role. NOTE: the role's list variable is `controller_workflows`.
#
# This is the single core workflow all four triggers (AAP UI, Self-Service
# Portal, ServiceNow, Azure DevOps) launch. Node shape mirrors the proven
# Windows daily-demo (DDW) graph; the single Azure "Provision VM" Terraform node
# stands in for DDW's Network Create → VM Create → Inventory Update → Get
# Instance Info chain.
#
#   Provision VM ─success─┬─► Powershell Improvement ─┬─► Website Setup ─success─► Patching ──always──┐
#                         │                           └─► Provision Access ─────────► Patching         │
#                         │                              Website Setup ──always──┐                      │
#                         ├─► Configure Linux ──always───────────────────────────┤                      │
#                         ├─► Install DT (Win) ──always──────────────────────────┼─► Configure DT Web   │
#                         ├─► Install DT (Linux) ──always────────────────────────┘   Availability ──────┤
#                         └─► Create CMDB CI ─► Create CMDB Relationship           (converge 4 parents)  │
#                                                                                                        ▼
#                                            Update RITM (success) [converge: Patching + Configure DT Web Availability]
#
# Phase 19 (AB#160) web-availability node:
#   Configure DT Web Availability enables the Dynatrace process-group alerting
#   rule that lets a website outage raise a Davis problem (the DT->EDA self-heal
#   trigger). It must run AFTER the web process exists AND OneAgent is reporting,
#   so it converges four always-parents — Install DT (Win), Install DT (Linux),
#   Website Setup (IIS), Configure Linux (httpd) — and feeds Update RITM. The
#   role retries until Dynatrace has detected the web PGs, then skips cleanly if
#   not, so it never fails the workflow.
#
# Phase 8 ServiceNow callback:
#   Create CMDB CI runs EARLY, on a parallel branch off Provision VM (mirrors
#   DDW branching CMDB off Get Instance Info) — it registers the CI alongside the
#   configure chain instead of waiting for Patching. The set_stats emitted by
#   provision_vm.yml (my_server/my_public_ip/my_instance_id/my_instance_type) are
#   available the moment Provision VM finishes, so the early branch has its data.
#
#   Website Setup / Configure Linux / Install DT (Win) / Install DT (Linux)
#                     ─always─► Configure DT Web Availability  [converge, 4 parents]
#   Configure DT Web Availability ─always─► Update RITM (success)
#   Patching          ─always─► Update RITM (success) [converge, 2 parents]
#   Provision VM  ─failure─► Create Incident ─always─► Update RITM (failure)
#
# Configure DT Web Availability converges four always-parents (both DT installs +
# both web-setup nodes); all four complete (real work or clean skip on empty
# group) before it runs. Update RITM (success) then converges two always-parents:
# Patching (end of the Windows configure chain) and Configure DT Web Availability
# (which transitively gates Configure Linux + both DT nodes). So the RITM is
# closed only after every configure step AND availability alerting are done. CMDB
# is a parallel terminal branch — its failure does not block fulfillment.
# The callback JTs run THIS repo's guarded playbooks/servicenow/*, which no-op
# when ticket_number is absent — so AAP-UI / Self-Service / ADO launches (no
# ticket) stay green; only ServiceNow-triggered runs (ticket_number from EDA)
# actually touch ServiceNow.
#
# vm_size_tier is surveyed on the workflow so every trigger passes it in the
# same way; it flows to the Provision VM node.
controller_workflows:
  - name: "{{ workflow_name }}"
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    survey_enabled: true
    # Allow extra_vars at launch so the EDA rulebook can pass ticket_number /
    # ticket_sys_id / ansible_eda; without this the API launch is rejected 400
    # "Variables ... are not allowed on launch" (AB#91, live-found).
    ask_variables_on_launch: true
    survey_spec:
      name: ""
      description: "Provision and configure VM(s) on Azure — Windows, Linux (RHEL 9), or both"
      spec:
        - question_name: Operating system
          question_description: "Which OS to provision: Windows only, Linux (RHEL 9) only, or both in one run."
          variable: os_type
          type: multiplechoice
          required: true
          default: windows
          choices:
            - windows
            - linux
            - both
        - question_name: VM size tier
          question_description: Azure VM t-shirt size — B-series burstable family.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: medium-2cpu-8gb
          choices:
            - small-2cpu-4gb
            - medium-2cpu-8gb
            - large-4cpu-16gb
    related:
      workflow_nodes:
        # Start notice — root node (no parent), runs at launch in parallel with
        # Provision VM. Posts "started" + the AAP workflow job ID/deep link back
        # to the RITM. Terminal leaf. Guarded → no-op on non-ServiceNow runs.
        - identifier: ritm-start-notice
          unified_job_template:
            name: "DC1.Azure - RITM Start Notice"
            type: job_template
            organization:
              name: "{{ my_organization }}"

        - identifier: provision-vm
          unified_job_template:
            name: "DC1.Azure - Provision VM"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          related:
            success_nodes:
              - identifier: powershell-improvement
              - identifier: configure-linux
              - identifier: install-dynatrace-windows
              - identifier: install-dynatrace-linux
              - identifier: create-cmdb-ci
            failure_nodes:
              - identifier: create-incident

        # --- Windows configure chain -----------------------------------------------
        # No `limit:` — each upstream playbook already targets `hosts: windemo`.
        # When the windemo group is empty (os_type=linux) Ansible resolves the
        # pattern, finds zero hosts, and cleanly skips the play (rc=0). Using
        # `--limit` instead would error with "no hosts to target" (different
        # code path, not governed by host_pattern_mismatch).
        - identifier: powershell-improvement
          unified_job_template:
            name: "DC1.Azure - Powershell Improvement"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            success_nodes:
              - identifier: website-setup
              - identifier: provision-access

        - identifier: website-setup
          unified_job_template:
            name: "DC1.Azure - Website Setup"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            success_nodes:
              - identifier: patching
            # IIS must be up before DT can detect the web PG; always-edge so an
            # empty windows group (clean skip) still satisfies the convergence.
            always_nodes:
              - identifier: configure-dt-web-availability

        - identifier: provision-access
          unified_job_template:
            name: "DC1.Azure - Provision Access"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            success_nodes:
              - identifier: patching

        - identifier: patching
          unified_job_template:
            name: "DC1.Azure - Patching"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            always_nodes:
              - identifier: update-ritm-success

        # --- Phase 17: Linux configure path ------------------------------------
        # No `limit:` — the playbook targets `hosts: linuxweb` directly. When
        # the group is empty (os_type=windows) Ansible skips the play cleanly.
        - identifier: configure-linux
          unified_job_template:
            name: "DC1.Azure - Configure Linux"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            # Feeds the web-availability convergence (httpd must be up before DT
            # can detect the Linux web PG); that node in turn feeds Update RITM.
            always_nodes:
              - identifier: configure-dt-web-availability

        # --- Phase 18: Dynatrace OneAgent ------------------------------------
        # Two nodes (Windows + Linux) because AAP doesn't allow multiple
        # Machine credentials on a single JT. Parallel branches off Provision
        # VM — OneAgent installs immediately after the VM is provisioned,
        # running alongside the configure chain. Each targets its OS group;
        # empty group = clean skip. Both feed into update-ritm-success.
        - identifier: install-dynatrace-windows
          unified_job_template:
            name: "{{ dynatrace_template_windows }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            always_nodes:
              - identifier: configure-dt-web-availability

        - identifier: install-dynatrace-linux
          unified_job_template:
            name: "{{ dynatrace_template_linux }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            always_nodes:
              - identifier: configure-dt-web-availability

        # --- Phase 8 ServiceNow callback nodes (success path) ---------------
        # CMDB CI/Relationship run on a parallel branch off Provision VM (see
        # provision-vm.success_nodes above) — terminal at the relationship node.
        - identifier: create-cmdb-ci
          unified_job_template:
            name: "DC1.Azure - Create CMDB CI"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          related:
            success_nodes:
              - identifier: create-cmdb-relationship

        - identifier: create-cmdb-relationship    # terminal leaf
          unified_job_template:
            name: "DC1.Azure - Create CMDB Relationship"
            type: job_template
            organization:
              name: "{{ my_organization }}"

        # --- Phase 19: Dynatrace web-availability alerting (AB#160) ----------
        # Enables the process-group availability alerting rule so a website
        # outage raises a Davis problem (the DT->EDA self-heal trigger).
        # Converges four always-parents — both OneAgent installs (so DT is
        # reporting) and both web-setup nodes (so the web process exists) —
        # because the rule can only be set once DT has detected the web PG. The
        # role retries until detection, then skips cleanly, so this never fails
        # the workflow. Feeds Update RITM so fulfillment isn't reported until
        # alerting is armed.
        - identifier: configure-dt-web-availability
          unified_job_template:
            name: "{{ dt_web_availability_template }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          all_parents_must_converge: true
          related:
            always_nodes:
              - identifier: update-ritm-success

        # Update RITM (success) converges two parents: Patching (end of the
        # Windows configure chain) and Configure DT Web Availability (which
        # transitively gates Configure Linux + both DT installs). Both
        # always-complete (real work or clean skip on empty group), so
        # convergence fires reliably for all os_type values.
        - identifier: update-ritm-success
          unified_job_template:
            name: "DC1.Azure - Update RITM (success)"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          all_parents_must_converge: true

        # --- Phase 8 ServiceNow callback nodes (failure path) ---------------
        - identifier: create-incident
          unified_job_template:
            name: "DC1.Azure - Create Incident"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          related:
            always_nodes:
              - identifier: update-ritm-failure

        - identifier: update-ritm-failure
          unified_job_template:
            name: "DC1.Azure - Update RITM (failure)"
            type: job_template
            organization:
              name: "{{ my_organization }}"

  # =========================================================================
  # Phase 19: Remediation workflow — Dynatrace website-down incident response
  # =========================================================================
  # Launched by the DT-EDA-PUSH - Service Remediation activation (from
  # aap.eda.dynatrace.push) when Dynatrace pushes a problem event.
  #
  #   dt-triage ──success──► remediate-linux ──always──┐
  #       │                                            ▼
  #       └──success──► remediate-windows ──always──► close-incident
  #                                               (all_parents_must_converge)
  #
  # dt-triage parses the DT event, does CMDB lookup and change ticket check,
  # creates an incident if no CHG in Implement phase is linked to the CI.
  # Remediation nodes guard on affected_os_type (set_stats from triage) —
  # the non-matching OS node skips cleanly. close-incident posts an executive
  # summary and resolves the INC.
  - name: "{{ remediate_workflow_name }}"
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    ask_variables_on_launch: true
    related:
      workflow_nodes:
        - identifier: dt-triage
          unified_job_template:
            name: "{{ triage_template }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          related:
            success_nodes:
              - identifier: remediate-linux
              - identifier: remediate-windows

        - identifier: remediate-linux
          unified_job_template:
            name: "{{ remediate_linux_template }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            always_nodes:
              - identifier: close-incident

        - identifier: remediate-windows
          unified_job_template:
            name: "{{ remediate_windows_template }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            always_nodes:
              - identifier: close-incident

        - identifier: close-incident
          unified_job_template:
            name: "{{ close_incident_template }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          all_parents_must_converge: true

  # =========================================================================
  # Phase 22: Teardown workflow — graceful decommission (AB#171)
  # =========================================================================
  # Wraps the existing Teardown JT (destroy + inventory/host_metrics cleanup +
  # retire CMDB CI + dt_decommission backstop) with a FIRST stage that
  # gracefully uninstalls Dynatrace OneAgent while the VMs are still reachable.
  # Removing OneAgent before destroy lets Dynatrace drop the host cleanly, so
  # the VMs vanishing never raises stale "process/host unavailable" problems —
  # the root-cause fix for the AB#165 leak (dt_decommission inside the Teardown
  # JT stays as a backstop). The nightly schedules now launch THIS workflow.
  #
  #   Uninstall OneAgent (Win) ──always──┐
  #   Uninstall OneAgent (Linux) ─always─┴─► Teardown  [all_parents_must_converge]
  #
  # The two uninstall nodes run on the live hosts (windemo / linuxweb); an empty
  # OS group is a clean skip, so the always-edges converge for any os_type. They
  # complete (releasing the inventory host lock) before the Teardown node runs —
  # which, per AB#73, targets the control inventory so it can deregister the
  # dc1-azure hosts it just destroyed. os_type=both is baked on the Teardown JT,
  # so a scheduled run with no survey still destroys everything.
  - name: "{{ teardown_workflow_name }}"
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    ask_variables_on_launch: true
    related:
      workflow_nodes:
        - identifier: uninstall-dt-windows
          unified_job_template:
            name: "{{ dt_uninstall_template_windows }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            always_nodes:
              - identifier: teardown

        - identifier: uninstall-dt-linux
          unified_job_template:
            name: "{{ dt_uninstall_template_linux }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: ""
          related:
            always_nodes:
              - identifier: teardown

        - identifier: teardown    # terminal — destroy + cleanup + retire CMDB
          unified_job_template:
            name: "{{ teardown_template }}"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          all_parents_must_converge: true
