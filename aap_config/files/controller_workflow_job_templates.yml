---
# Consumed by the infra.aap_configuration.controller_workflow_job_templates
# role. NOTE: the role's list variable is `controller_workflows`.
#
# This is the single core workflow all four triggers (AAP UI, Self-Service
# Portal, ServiceNow, Azure DevOps) launch. Node shape mirrors the proven
# Windows daily-demo (DDW) graph; the single Azure "Provision VM" Terraform node
# stands in for DDW's Network Create → VM Create → Inventory Update → Get
# Instance Info chain.
#
#   Provision VM ─success─┬─► Powershell Improvement ─┬─► Website Setup ────┐
#                         │                           └─► Provision Access ─┴─► Patching ──always──┐
#                         ├─► Configure Linux ──success────────────────────────────────────────────┴─► Update RITM (success)
#                         └─► Create CMDB CI ─► Create CMDB Relationship
#
# Phase 8 ServiceNow callback:
#   Create CMDB CI runs EARLY, on a parallel branch off Provision VM (mirrors
#   DDW branching CMDB off Get Instance Info) — it registers the CI alongside the
#   configure chain instead of waiting for Patching. The set_stats emitted by
#   provision_vm.yml (my_server/my_public_ip/my_instance_id/my_instance_type) are
#   available the moment Provision VM finishes, so the early branch has its data.
#
#   Patching      ─always─► Update RITM (success)
#   Provision VM  ─failure─► Create Incident ─always─► Update RITM (failure)
#
# Update RITM (success) hangs off Patching `always` (mirrors DDW "Update request
# ticket - success") so it fires whenever the workflow reaches Patching, decoupled
# from CMDB — a CMDB failure no longer blocks the request being marked fulfilled.
# The callback JTs run THIS repo's guarded playbooks/servicenow/*, which no-op
# when ticket_number is absent — so AAP-UI / Self-Service / ADO launches (no
# ticket) stay green; only ServiceNow-triggered runs (ticket_number from EDA)
# actually touch ServiceNow.
#
# vm_size_tier is surveyed on the workflow so every trigger passes it in the
# same way; it flows to the Provision VM node.
controller_workflows:
  - name: "{{ workflow_name }}"
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    survey_enabled: true
    # Allow extra_vars at launch so the EDA rulebook can pass ticket_number /
    # ticket_sys_id / ansible_eda; without this the API launch is rejected 400
    # "Variables ... are not allowed on launch" (AB#91, live-found).
    ask_variables_on_launch: true
    survey_spec:
      name: ""
      description: "Provision and configure VM(s) on Azure — Windows, Linux (RHEL 9), or both"
      spec:
        - question_name: Operating system
          question_description: "Which OS to provision: Windows only, Linux (RHEL 9) only, or both in one run."
          variable: os_type
          type: multiplechoice
          required: true
          default: windows
          choices:
            - windows
            - linux
            - both
        - question_name: VM size tier
          question_description: Azure VM t-shirt size — B-series burstable family.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: medium-2cpu-8gb
          choices:
            - small-2cpu-4gb
            - medium-2cpu-8gb
            - large-4cpu-16gb
    related:
      workflow_nodes:
        # Start notice — root node (no parent), runs at launch in parallel with
        # Provision VM. Posts "started" + the AAP workflow job ID/deep link back
        # to the RITM. Terminal leaf. Guarded → no-op on non-ServiceNow runs.
        - identifier: ritm-start-notice
          unified_job_template:
            name: "DC1.Azure - RITM Start Notice"
            type: job_template
            organization:
              name: "{{ my_organization }}"

        - identifier: provision-vm
          unified_job_template:
            name: "DC1.Azure - Provision VM"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          related:
            success_nodes:
              - identifier: powershell-improvement
              - identifier: configure-linux          # Phase 17: parallel Linux configure path
              - identifier: create-cmdb-ci           # parallel early-CMDB branch (mirrors DDW)
            failure_nodes:
              - identifier: create-incident

        - identifier: powershell-improvement
          unified_job_template:
            name: "DC1.Azure - Powershell Improvement"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: windemo
          related:
            success_nodes:
              - identifier: website-setup
              - identifier: provision-access

        - identifier: website-setup
          unified_job_template:
            name: "DC1.Azure - Website Setup"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: windemo
          related:
            success_nodes:
              - identifier: patching

        - identifier: provision-access
          unified_job_template:
            name: "DC1.Azure - Provision Access"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: windemo
          related:
            success_nodes:
              - identifier: patching

        - identifier: patching
          unified_job_template:
            name: "DC1.Azure - Patching"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: windemo
          related:
            always_nodes:
              - identifier: update-ritm-success     # decoupled from CMDB (mirrors DDW)

        # --- Phase 17: Linux configure path ------------------------------------
        # Runs in parallel with the Windows chain. When os_type excludes linux
        # the linuxweb group is empty — the job fails ("no hosts to target")
        # and the success edge to update-ritm-success does NOT fire, which is
        # the desired behaviour (we only want to signal RITM success from the
        # path that actually ran). Uses success_nodes (not always_nodes) so the
        # empty-limit failure is silently absorbed by the workflow.
        - identifier: configure-linux
          unified_job_template:
            name: "DC1.Azure - Configure Linux"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          limit: linuxweb
          related:
            success_nodes:
              - identifier: update-ritm-success

        # --- Phase 8 ServiceNow callback nodes (success path) ---------------
        # CMDB CI/Relationship run on a parallel branch off Provision VM (see
        # provision-vm.success_nodes above) — terminal at the relationship node.
        - identifier: create-cmdb-ci
          unified_job_template:
            name: "DC1.Azure - Create CMDB CI"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          related:
            success_nodes:
              - identifier: create-cmdb-relationship

        - identifier: create-cmdb-relationship    # terminal leaf
          unified_job_template:
            name: "DC1.Azure - Create CMDB Relationship"
            type: job_template
            organization:
              name: "{{ my_organization }}"

        # Update RITM (success) fires when the FIRST completing OS path
        # signals it: patching (always — Windows) or configure-linux (success
        # — Linux). For single-OS runs only one edge fires; for os_type=both
        # the faster path triggers the RITM update (the other still completes
        # but the RITM is already marked fulfilled).
        - identifier: update-ritm-success
          unified_job_template:
            name: "DC1.Azure - Update RITM (success)"
            type: job_template
            organization:
              name: "{{ my_organization }}"

        # --- Phase 8 ServiceNow callback nodes (failure path) ---------------
        - identifier: create-incident
          unified_job_template:
            name: "DC1.Azure - Create Incident"
            type: job_template
            organization:
              name: "{{ my_organization }}"
          related:
            always_nodes:
              - identifier: update-ritm-failure

        - identifier: update-ritm-failure
          unified_job_template:
            name: "DC1.Azure - Update RITM (failure)"
            type: job_template
            organization:
              name: "{{ my_organization }}"
