---
# Consumed by the infra.aap_configuration.controller_role_team_assignments role.
# Phase 9 (AB#107) — grants the DC1.Azure - Developers team **Execute** on the
# self-service JOB templates jr-dev may run from the portal:
#   - DC1.Azure - Request Windows VM  (launcher JT — fires the workflow; the portal
#     surfaces job templates only, NOT workflows, so this is the entry point)
#   - DC1.Azure - Gather and Display Facts  (Phase 11 facts JT)
# Demo users inherit Execute via team membership (gateway_role_user_assignments.yml).
# jr-dev needs no direct workflow permission — the launcher runs the workflow under
# the DC1.Azure - Controller credential.
#
# NOTE 1 — explicit role: this role is NOT in the infra.aap_configuration.dispatch
# default list (the dispatcher carries the gateway_* assignment roles but not the
# controller_* ones), so load.yml runs it with an explicit include_role AFTER
# dispatch — by which point the launcher JT exists even on a fresh env.
#
# NOTE 2 — object_id, not name: the controller role-assignment module identifies
# the target only by numeric object_id (+ content_type) — no by-name option. The id
# is env-specific, so load.yml resolves it at runtime (GET .../job_templates/?name=...)
# into dc1_launcher_jt_id. If empty (launcher JT not created yet) this degrades to []
# and a later re-apply picks it up.
#
# Role-definition name is the AAP built-in (verified live): "JobTemplate Execute"
# (content_type awx.jobtemplate).
# Each entry is guarded on its resolved id so a not-yet-created JT degrades to []
# (and a later re-apply picks it up) instead of erroring.
controller_role_team_assignments: >-
  {{
    (
      [{
        'role_definition': 'JobTemplate Execute',
        'team': team_developers,
        'content_type': 'awx.jobtemplate',
        'object_id': dc1_launcher_jt_id | int,
      }] if (dc1_launcher_jt_id | default('') | string | length > 0) else []
    ) + (
      [{
        'role_definition': 'JobTemplate Execute',
        'team': team_developers,
        'content_type': 'awx.jobtemplate',
        'object_id': dc1_facts_jt_id | int,
      }] if (dc1_facts_jt_id | default('') | string | length > 0) else []
    )
  }}
