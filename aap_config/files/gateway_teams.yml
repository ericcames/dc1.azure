---
# Consumed by the infra.aap_configuration.gateway_teams role.
# AAP gateway teams. Sourced from aap.as.code; scoped under my_organization.
aap_teams:
  - name: Network
    description: The Network Team
    organization: "{{ my_organization }}"
    state: present
  - name: Server
    description: The Server Team
    organization: "{{ my_organization }}"
    state: present
  - name: Storage
    description: The Storage Team
    organization: "{{ my_organization }}"
    state: present
  - name: ITO
    description: IT Operations
    organization: "{{ my_organization }}"
    state: present
  # Phase 9 (AB#107): persona container for the Self-Service Portal demo. Holds
  # WorkflowJobTemplate Execute on DC1.Azure - Provision and Configure; demo users
  # inherit it via membership (see gateway_users.yml + the role-assignment files).
  - name: "{{ team_developers }}"
    description: Developer self-service personas (DC1.Azure Phase 9)
    organization: "{{ my_organization }}"
    state: present
