---
# Consumed by the infra.aap_configuration.controller_inventories role.
#
# The `windemo` group (the group the reused aap.dailydemo.windows playbooks
# target) is created and populated at runtime by provision_vm.yml, which
# registers the new VM via the controller API. Group/inventory vars carry the
# WinRM connection settings.
controller_inventories:
  - name: "{{ inventory_name }}"
    organization: "{{ my_organization }}"
    variables:
      # Applied to all hosts; the `windows` group is populated at runtime.
      ansible_connection: winrm
      ansible_port: 5986
      ansible_winrm_transport: ntlm
      ansible_winrm_server_cert_validation: ignore
