---
# Consumed by the infra.aap_configuration.controller_inventories role.
#
# Runtime groups (created by provision_vm.yml, not CaC):
#   - `windemo`  — Windows hosts; group vars set WinRM connection settings
#   - `linuxweb` — Linux hosts; group vars set SSH connection settings
# Connection vars live at the GROUP level (not inventory) so Windows and Linux
# hosts coexist cleanly in the same inventory.
controller_inventories:
  - name: "{{ inventory_name }}"
    organization: "{{ my_organization }}"
    variables: {}

  # Control inventory the Teardown JT runs against (AB#73). The teardown play
  # runs on localhost and deregisters the VM from `dc1-azure` over the API, so
  # the JT must not run against `dc1-azure` itself — AAP locks the hosts of the
  # inventory a running job uses, blocking the job from deleting the very host
  # it's "running against". Kept empty: AWX provides an implicit localhost, so
  # no host definition is needed for a `hosts: localhost`, `connection: local`
  # play.
  - name: "{{ control_inventory_name }}"
    organization: "{{ my_organization }}"
