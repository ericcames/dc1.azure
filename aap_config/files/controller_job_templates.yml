---
# Consumed by the infra.aap_configuration.controller_job_templates role.
# NOTE: the role's list variable is `controller_templates` (not
# `controller_job_templates`) — a known collection quirk.
#
# Six JTs: one Azure provision + four reused Windows configure steps + teardown.
# The Configure steps run the pinned `aap.dailydemo.windows` project's existing
# playbooks (retains the upstream workflow). The Provision/Teardown playbooks
# live in this repo and are built in Phase 4.
controller_templates:
  - name: "DC1.Azure - Provision VM"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/provision_vm.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_azure_rm }}"           # ARM_* for Terraform
      - "{{ cred_controller }}"         # CONTROLLER_* for inventory registration
      - "{{ cred_vault }}"              # decrypts the vaulted admin-password var
      - "{{ cred_win_admin_password }}" # injects dc1_azure_windows_admin_password extra var
    extra_vars:
      dc1_azure_resource_group: "{{ azure_resource_group }}"
      dc1_azure_location: "{{ azure_location }}"
      dc1_azure_tf_storage_account: "{{ azure_tf_storage_account }}"
      dc1_azure_linux_ssh_public_key: "{{ linux_ssh_public_key }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick a VM size tier"
      spec:
        - question_name: VM size tier
          question_description: Azure VM t-shirt size — B-series burstable family.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: medium-2cpu-8gb
          choices:
            - small-2cpu-4gb
            - medium-2cpu-8gb
            - large-4cpu-16gb

  - name: "DC1.Azure - Powershell Improvement"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ windows_project_name }}"
    playbook: playbooks/05_powershell_improve.yml
    execution_environment: "{{ my_execution_environment }}"
    ask_limit_on_launch: true
    credentials:
      - "{{ cred_windows }}"

  - name: "DC1.Azure - Website Setup"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/website_setup.yml
    execution_environment: "{{ my_execution_environment }}"
    ask_limit_on_launch: true
    credentials:
      - "{{ cred_windows }}"
    extra_vars:
      dc1_azure_location: "{{ azure_location }}"

  - name: "DC1.Azure - Provision Access"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ windows_project_name }}"
    playbook: playbooks/06_windows_account_create.yml
    execution_environment: "{{ my_execution_environment }}"
    ask_limit_on_launch: true
    credentials:
      - "{{ cred_windows }}"
      - "{{ cred_vault }}"
      - "{{ cred_demo_account_password }}"

  - name: "DC1.Azure - Patching"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ windows_project_name }}"
    playbook: playbooks/07_windows_patching.yml
    execution_environment: "{{ my_execution_environment }}"
    ask_limit_on_launch: true
    credentials:
      - "{{ cred_windows }}"

  # --- Phase 17: Linux post-provision configuration -------------------------
  # Combined JT: Apache httpd, firewalld, branded website, MOTD, SSH banner,
  # and dnf security updates. Targets the linuxweb group (RHEL 9 VMs
  # registered by provision_vm.yml). RHSM/CDN registration deferred.
  - name: "DC1.Azure - Configure Linux"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/configure_linux.yml
    execution_environment: "{{ my_execution_environment }}"
    ask_limit_on_launch: true
    credentials:
      - "{{ cred_linux }}"
    extra_vars:
      dc1_azure_location: "{{ azure_location }}"

  # --- Phase 11: Fact caching & inventory visibility -------------------------
  # Standalone demo JT. `use_fact_cache: true` persists the gathered facts to the
  # AAP database (viewable per-host under Infrastructure → Hosts → Facts); the
  # playbook also prints a curated summary to the job log. Runs this repo's own
  # playbooks/gather_facts.yml against the provisioned Windows VM over WinRM.
  - name: "{{ facts_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/gather_facts.yml
    execution_environment: "{{ my_execution_environment }}"
    use_fact_cache: true
    credentials:
      - "{{ cred_windows }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Optionally dump the complete fact set to the job log"
      spec:
        - question_name: Show full facts
          question_description: >-
            Also print the entire ansible_facts dict to the job log (large on
            Windows). The full set is stored in the AAP DB regardless.
          variable: show_full_facts
          type: multiplechoice
          required: false
          default: "false"
          choices:
            - "false"
            - "true"

  # --- Phase 9: Self-Service Portal launcher ---------------------------------
  # The portal surfaces JOB templates only (not workflows), so this thin JT is the
  # Self-Service entry point: it fires the DC1.Azure - Provision and Configure
  # workflow with the chosen size (playbooks/launch_workflow.yml). The Developers
  # team gets Execute on it (controller_role_team_assignments.yml) so jr-dev can
  # Start it from the portal. Runs on the control inventory (localhost launch play);
  # the DC1.Azure - Controller credential injects CONTROLLER_* for the launch call.
  - name: "{{ launcher_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/launch_workflow.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_controller }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick an OS and VM size tier"
      spec:
        - question_name: Operating system
          question_description: "Which OS to provision."
          variable: os_type
          type: multiplechoice
          required: true
          default: windows
          choices:
            - windows
            - linux
            - both
        - question_name: VM size tier
          question_description: Azure VM t-shirt size — B-series burstable family.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: medium-2cpu-8gb
          choices:
            - small-2cpu-4gb
            - medium-2cpu-8gb
            - large-4cpu-16gb

  # --- Phase 8: ServiceNow callback JTs --------------------------------------
  # These run THIS repo's guarded playbooks/servicenow/* (not the Windows roles)
  # so non-ServiceNow launches no-op (guard on ticket_number). All run on the
  # control inventory (localhost plays) with the ServiceNow credential.
  # Start notice — runs first (root node, parallel to Provision VM). Needs BOTH
  # the ServiceNow cred (write the RITM) and the Controller cred (CONTROLLER_HOST
  # for the workflow-job deep link). Guarded on ticket_number.
  - name: "DC1.Azure - RITM Start Notice"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/notice_ritm_started.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
      - "{{ cred_controller }}"

  - name: "DC1.Azure - Create CMDB CI"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/create_ci.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"

  - name: "DC1.Azure - Create CMDB Relationship"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/create_cmdb_relationship.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"

  - name: "DC1.Azure - Update RITM (success)"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_ritm.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    extra_vars:
      ritm_outcome: success

  - name: "DC1.Azure - Update RITM (failure)"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_ritm.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    extra_vars:
      ritm_outcome: failure

  - name: "DC1.Azure - Create Incident"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/create_incident.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"

  - name: "{{ teardown_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    # Runs against the control inventory, NOT dc1-azure (AB#73): AAP locks the
    # hosts of the inventory a running job uses, which would block this job from
    # deregistering the VM it just destroyed. The play runs on localhost and the
    # deregistration step targets dc1-azure over the API regardless.
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/teardown.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_azure_rm }}"     # ARM_* for Terraform
      - "{{ cred_controller }}"   # CONTROLLER_* for host deregistration
      - "{{ cred_vault }}"        # decrypts the vaulted admin-password var
    extra_vars:
      dc1_azure_resource_group: "{{ azure_resource_group }}"
      dc1_azure_location: "{{ azure_location }}"
      dc1_azure_tf_storage_account: "{{ azure_tf_storage_account }}"
      os_type: both
      # destroy doesn't use the admin password, but terraform requires the var
      # (12-72 chars) and teardown.yml asserts its length. Bake a non-secret
      # placeholder so scheduled/manual teardown runs need no password input.
      dc1_azure_windows_admin_password: "{{ teardown_admin_password_placeholder }}"

  # Phase 18 (AB#147): Dynatrace OneAgent installation on provisioned VMs.
  # Split into two JTs (Windows + Linux) because AAP doesn't allow multiple
  # Machine credentials on a single JT. Each targets its OS group; empty
  # group = clean skip.
  - name: "{{ dynatrace_template_windows }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/install_dynatrace_oneagent_windows.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_dynatrace }}"
      - "{{ cred_windows }}"
      - "{{ cred_servicenow }}"
    extra_vars:
      dt_host_group: "{{ dt_host_group }}"

  - name: "{{ dynatrace_template_linux }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/install_dynatrace_oneagent_linux.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_dynatrace }}"
      - "{{ cred_linux }}"
      - "{{ cred_servicenow }}"
    extra_vars:
      dt_host_group: "{{ dt_host_group }}"

  # --- Phase 19: EDA incident response — Dynatrace website-down demo ----------
  # Service management JTs (break/restart/verify for demo setup + remediation).
  # Split by OS: AAP doesn't allow multiple Machine credentials per JT.
  - name: "{{ break_website_template_linux }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/webserver_manage_linux.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_linux }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Manage the Linux web service (httpd)"
      spec:
        - question_name: Action
          question_description: "break = stop service, restart = start service, verify = check HTTP 200, status = report state"
          variable: webserver_manage_action
          type: multiplechoice
          required: true
          default: status
          choices:
            - break
            - restart
            - verify
            - status

  - name: "{{ break_website_template_windows }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/webserver_manage_windows.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_windows }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Manage the Windows web service (IIS)"
      spec:
        - question_name: Action
          question_description: "break = stop service, restart = start service, verify = check HTTP 200, status = report state"
          variable: webserver_manage_action
          type: multiplechoice
          required: true
          default: status
          choices:
            - break
            - restart
            - verify
            - status

  # Triage node — parse DT event, CMDB lookup, change ticket check, create INC.
  # Runs on control inventory (localhost). ask_variables_on_launch lets the
  # workflow pass dt_push_event from EDA.
  - name: "{{ triage_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/dt_triage.yml
    execution_environment: "{{ my_execution_environment }}"
    ask_variables_on_launch: true
    credentials:
      - "{{ cred_servicenow }}"

  # Remediation nodes — restart service, verify, gather RCA, snow_log.
  # Split by OS for Machine credential separation.
  - name: "{{ remediate_linux_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/dt_remediate_linux.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_linux }}"
      - "{{ cred_servicenow }}"

  - name: "{{ remediate_windows_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/dt_remediate_windows.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_windows }}"
      - "{{ cred_servicenow }}"

  # Close incident node — queries DT Problems API for Davis root cause
  # analysis, posts executive summary with RCA + AAP job URL, resolves INC.
  # Runs on control inventory (localhost). AB#154 added cred_dynatrace
  # (DT_API_TOKEN for RCA query) and cred_controller (CONTROLLER_HOST for
  # the AAP workflow job URL).
  - name: "{{ close_incident_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/dt_close_incident.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
      - "{{ cred_dynatrace }}"
      - "{{ cred_controller }}"

  # Confirm resolution — receives a DT CLOSED event from EDA, finds the
  # ServiceNow incident by problem ID, posts a confirmation work note.
  # Launched by the aap.eda.dynatrace.push rulebook's CLOSED-event rule.
  - name: "{{ confirm_resolution_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/dt_confirm_resolution.yml
    execution_environment: "{{ my_execution_environment }}"
    ask_variables_on_launch: true
    credentials:
      - "{{ cred_servicenow }}"
      - "{{ cred_dynatrace }}"

  # Linux gather_facts — mirrors the Windows version for the linuxweb group.
  - name: "{{ facts_template_linux }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/gather_facts_linux.yml
    execution_environment: "{{ my_execution_environment }}"
    use_fact_cache: true
    credentials:
      - "{{ cred_linux }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Optionally dump the complete fact set to the job log"
      spec:
        - question_name: Show full facts
          question_description: >-
            Also print the entire ansible_facts dict to the job log.
            The full set is stored in the AAP DB regardless.
          variable: show_full_facts
          type: multiplechoice
          required: false
          default: "false"
          choices:
            - "false"
            - "true"

  # Phase 12 (AB#144): automate the ADO trigger setup. Mints an AAP token,
  # creates/updates the dc1-azure-aap Variable Group in ADO Library, and
  # authorizes the launch pipeline.
  - name: "DC1.Azure - Configure ADO Trigger"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/ado/configure_ado_trigger.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_controller }}"   # CONTROLLER_* for AAP token minting
    extra_vars:
      ado_org: "{{ ado_org }}"
      ado_project: "{{ ado_project }}"
      ado_pat: "{{ ado_pat }}"
