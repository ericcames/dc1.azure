---
# Consumed by the infra.aap_configuration.controller_job_templates role.
# NOTE: the role's list variable is `controller_templates` (not
# `controller_job_templates`) — a known collection quirk.
#
# Six JTs: one Azure provision + four reused Windows configure steps + teardown.
# The Configure steps run the pinned `aap.dailydemo.windows` project's existing
# playbooks (retains the upstream workflow). The Provision/Teardown playbooks
# live in this repo and are built in Phase 4.
controller_templates:
  - name: "DC1.Azure - Provision VM"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/provision_vm.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_azure_rm }}"           # ARM_* for Terraform
      - "{{ cred_controller }}"         # CONTROLLER_* for inventory registration
      - "{{ cred_vault }}"              # decrypts the vaulted admin-password var
      - "{{ cred_win_admin_password }}" # injects dc1_azure_windows_admin_password extra var
    extra_vars:
      dc1_azure_resource_group: "{{ azure_resource_group }}"
      dc1_azure_location: "{{ azure_location }}"
      dc1_azure_tf_storage_account: "{{ azure_tf_storage_account }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick a VM size tier"
      spec:
        - question_name: VM size tier
          question_description: Azure VM t-shirt size — all Dsv5 family. Verify RHDP quota before using large-8cpu-32gb.
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: medium-4cpu-16gb
          choices:
            - small-2cpu-8gb
            - medium-4cpu-16gb
            - large-8cpu-32gb

  - name: "DC1.Azure - Powershell Improvement"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ windows_project_name }}"
    playbook: playbooks/05_powershell_improve.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_windows }}"

  - name: "DC1.Azure - Website Setup"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/website_setup.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_windows }}"
    extra_vars:
      dc1_azure_location: "{{ azure_location }}"

  - name: "DC1.Azure - Provision Access"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ windows_project_name }}"
    playbook: playbooks/06_windows_account_create.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_windows }}"
      - "{{ cred_vault }}"
      - "{{ cred_demo_account_password }}"

  - name: "DC1.Azure - Patching"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ windows_project_name }}"
    playbook: playbooks/07_windows_patching.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_windows }}"

  # --- Phase 8: ServiceNow callback JTs --------------------------------------
  # These run THIS repo's guarded playbooks/servicenow/* (not the Windows roles)
  # so non-ServiceNow launches no-op (guard on ticket_number). All run on the
  # control inventory (localhost plays) with the ServiceNow credential.
  - name: "DC1.Azure - Create CMDB CI"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/create_ci.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"

  - name: "DC1.Azure - Create CMDB Relationship"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/create_cmdb_relationship.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"

  - name: "DC1.Azure - Update RITM (success)"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_ritm.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    extra_vars:
      ritm_outcome: success

  - name: "DC1.Azure - Update RITM (failure)"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_ritm.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    extra_vars:
      ritm_outcome: failure

  - name: "DC1.Azure - Create Incident"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/create_incident.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"

  - name: "{{ teardown_template }}"
    job_type: run
    organization: "{{ my_organization }}"
    # Runs against the control inventory, NOT dc1-azure (AB#73): AAP locks the
    # hosts of the inventory a running job uses, which would block this job from
    # deregistering the VM it just destroyed. The play runs on localhost and the
    # deregistration step targets dc1-azure over the API regardless.
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/teardown.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_azure_rm }}"     # ARM_* for Terraform
      - "{{ cred_controller }}"   # CONTROLLER_* for host deregistration
      - "{{ cred_vault }}"        # decrypts the vaulted admin-password var
    extra_vars:
      dc1_azure_resource_group: "{{ azure_resource_group }}"
      dc1_azure_location: "{{ azure_location }}"
      dc1_azure_tf_storage_account: "{{ azure_tf_storage_account }}"
      # destroy doesn't use the admin password, but terraform requires the var
      # (12-72 chars) and teardown.yml asserts its length. Bake a non-secret
      # placeholder so scheduled/manual teardown runs need no password input.
      dc1_azure_windows_admin_password: "{{ teardown_admin_password_placeholder }}"
