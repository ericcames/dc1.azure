---
# Consumed by the infra.aap_configuration.eda_credentials role.
# EDA has its OWN credential store (separate from controller_credentials), so
# these three are EDA-side credentials, namespaced `DC1.Azure -` per ROADMAP.
# Inputs come from env-var lookups in group_vars/all.yml — no secrets here.
eda_credentials:
  - name: "{{ eda_controller_credential }}"
    # Lets EDA launch the controller workflow via run_workflow_template. The
    # rulebook activation references this credential (eda_credentials list) so
    # the rulebook authenticates to Controller without an inline token.
    organization: "{{ my_organization }}"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ controller_cred_host }}/api/controller/"
      username: "{{ controller_cred_username }}"
      password: "{{ controller_cred_password }}"
      verify_ssl: false

  - name: "{{ eda_snow_event_stream_credential }}"
    # The event stream's TYPE is derived from this credential's type
    # ('ServiceNow Event Stream'); there is no separate event_stream_type field
    # (it is deprecated/ignored in ansible.eda). The token is the shared secret
    # ServiceNow's Outbound REST Message sends as `Authorization: Bearer <token>`.
    organization: "{{ my_organization }}"
    credential_type: "ServiceNow Event Stream"
    inputs:
      auth_type: token
      http_header_key: Authorization
      token: "{{ eda_event_stream_token }}"

  - name: "{{ eda_scm_credential }}"
    # SCM credential the EDA project uses to sync this repo's rulebook from the
    # Azure DevOps git URL. Same ADO PAT auth as the controller-side
    # 'DC1.Azure - ADO Source Control' credential, but EDA needs its own copy.
    organization: "{{ my_organization }}"
    credential_type: "Source Control"
    inputs:
      username: "{{ ado_username }}"
      password: "{{ ado_pat }}"
