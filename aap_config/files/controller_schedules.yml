---
# Consumed by the infra.aap_configuration.controller_schedules role.
# Two nightly teardown schedules so the demo VM never runs overnight (keeps
# Azure cost at $0 between demos). The 6 PM run is the primary; the 10 PM run
# is a safety net for late-night work sessions. The teardown JT is idempotent —
# if no VM exists, terraform destroy is a no-op, so the second run costs nothing.
#
# Timezone: America/Phoenix observes NO daylight saving, so times there are
# fixed UTC offsets year-round. Encode with TZID so AAP renders/fires them as
# local Phoenix time regardless of server timezone.
#
# The teardown JT bakes a non-secret placeholder admin password
# (teardown_admin_password_placeholder), so these schedules need no extra_data.

controller_schedules:
  - name: "{{ teardown_schedule_name }}"
    unified_job_template: "{{ teardown_workflow_name }}"
    description: "Tear down the DC1.Azure VM every day at 6 PM America/Phoenix (no DST)."
    rrule: "DTSTART;TZID=America/Phoenix:20260527T180000 RRULE:FREQ=DAILY;INTERVAL=1"
    enabled: true

  - name: "{{ teardown_schedule_name_late }}"
    unified_job_template: "{{ teardown_workflow_name }}"
    description: "Safety-net teardown at 10 PM America/Phoenix — catches late work sessions."
    rrule: "DTSTART;TZID=America/Phoenix:20260527T220000 RRULE:FREQ=DAILY;INTERVAL=1"
    enabled: true
