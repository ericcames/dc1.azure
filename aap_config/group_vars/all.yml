---
# ============================================================================
# dc1.azure CaC variables — connection, secrets (by reference), object names
# ============================================================================
# NO secrets in version control. Every sensitive value is resolved at runtime
# from a dc1.azure-owned environment variable (decision 2026-05-26: this repo
# provisions its own vault/secret inputs rather than borrowing aap.as.code's
# ~/.ansible/secrets2). The repo-based setup skill (Phase 7) exports these.
# ============================================================================

# --- AAP API connection (consumed by infra.aap_configuration.dispatch) -------
# aap_token is normally NOT set from a stored value: load.yml/validate.yml mint
# a short-lived token from AAP_CONTROLLER_USERNAME/PASSWORD and overwrite this
# fact at runtime (tasks/aap_token_acquire.yml), then delete it in always:. The
# env lookup here is only the SSO/manual escape hatch — export AAP_TOKEN (e.g. a
# UI-minted token) and it is used as-is and left untouched.
aap_hostname: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') }}"
aap_token: "{{ lookup('ansible.builtin.env', 'AAP_TOKEN') | default('', true) }}"
aap_validate_certs: "{{ lookup('ansible.builtin.env', 'AAP_VALIDATE_CERTS') | default('false', true) | bool }}"
# The infra.aap_configuration HUB roles (hub_ee_registry/repository/sync) auth to
# Automation Hub with BASIC auth (ah_username/ah_password ← aap_username/password)
# — they don't take a token. Define these explicitly so Hub auth no longer relies
# on an AAP_TOKEN env fallback happening to be set. Controller/gateway roles still
# use the short-lived aap_token minted by tasks/aap_token_acquire.yml.
aap_username: "{{ lookup('ansible.builtin.env', 'AAP_CONTROLLER_USERNAME') | default('admin', true) }}"
aap_password: "{{ lookup('ansible.builtin.env', 'AAP_CONTROLLER_PASSWORD') }}"

# --- Org + Execution Environment ---------------------------------------------
my_organization: "IT Service Automation"

# Private Automation Hub — container registry hostname.
# For AAP 2.5 unified platform the Hub registry is at the same host as the
# gateway (no scheme). Override AH_HOSTNAME if Hub is on a separate host.
ah_hostname: "{{ lookup('ansible.builtin.env', 'AH_HOSTNAME') | default(aap_hostname | urlsplit('hostname'), true) }}"

# EE name — used both in controller_execution_environments.yml (registration)
# and in controller_job_templates.yml (reference). Keep them in sync.
ee_name: "DC1.Azure - EE"

# EE version tag (AB#95) — the deliberate-update model. The EE is pinned to an
# IMMUTABLE semver tag (vMAJOR.MINOR.PATCH), never the floating `latest`, so the
# Controller EE can use `pull: missing` (pull once, then reuse the cached layer)
# instead of re-pulling ~521 MB every run. Shipping an update is deliberate: build
# a new tag → push → re-sync PAH → bump this string → re-apply load.yml. Bump rule:
#   CVE-only security rebuild  → patch (v1.0.1)
#   add/upgrade a collection   → minor (v1.1.0)
#   new base image / breaking  → major (v2.0.0)
# See docs/ee-versioning.md for the full runbook. v1.0.0 = the 2026-06-01 hardened
# baseline (quay digest sha256:4423a10…).
ee_version: "{{ lookup('ansible.builtin.env', 'DC1_AZURE_EE_VERSION') | default('v1.0.0', true) }}"

# EE image URL: defaults to the Private Automation Hub copy of the image at the
# pinned version tag. PAH syncs it from quay.io (see hub_ee_registries.yml /
# hub_ee_repositories.yml), and Controller pulls it from PAH using the
# cred_hub_registry credential — the image never leaves the platform at job-run
# time. The Hub image name is the hub_ee_repositories[].name (dc1_azure_ee),
# served at the gateway host.
# Override with the public quay.io image only for a Hub-less smoke test (the
# floating `latest` tag is retained on quay for exactly this):
#   export DC1_AZURE_EE_IMAGE=quay.io/zigfreed/dc1-azure-ee:latest
ee_image: "{{ lookup('ansible.builtin.env', 'DC1_AZURE_EE_IMAGE') | default(ah_hostname ~ '/dc1_azure_ee:' ~ ee_version, true) }}"

# JT-level EE reference — defaults to ee_name so load.yml and the JTs stay in
# sync without extra env vars. Override DC1_AZURE_EE only to point a specific
# JT at a different EE during testing.
my_execution_environment: "{{ lookup('ansible.builtin.env', 'DC1_AZURE_EE') | default(ee_name, true) }}"

# Red Hat AAP (Controller) credential inputs — lets provision_vm/teardown
# register hosts in the dc1-azure inventory via the controller API. Points at
# THIS same AAP. Username defaults to admin; password from env at load time.
controller_cred_host: "{{ aap_hostname }}"
controller_cred_username: "{{ lookup('ansible.builtin.env', 'AAP_CONTROLLER_USERNAME') | default('admin', true) }}"
controller_cred_password: "{{ lookup('ansible.builtin.env', 'AAP_CONTROLLER_PASSWORD') }}"

# --- Secret inputs (resolved at runtime; never committed) --------------------
vault_password: "{{ lookup('ansible.builtin.env', 'DC1_AZURE_VAULT_PASSWORD') }}"

azure_subscription_id: "{{ lookup('ansible.builtin.env', 'AZURE_SUBSCRIPTION_ID') }}"
azure_tenant_id: "{{ lookup('ansible.builtin.env', 'AZURE_TENANT_ID') }}"
azure_client_id: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_ID') }}"
azure_client_secret: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET') }}"

# Azure target environment — baked into the Provision/Teardown JT extra_vars at
# load time (env-specific; the RHDP resource group changes per open env).
azure_resource_group: "{{ lookup('ansible.builtin.env', 'AZURE_RESOURCE_GROUP') | default('REPLACE_ME_RHDP_RG', true) }}"
azure_location: "{{ lookup('ansible.builtin.env', 'AZURE_LOCATION') | default('eastus', true) }}"
# Storage account name for Terraform remote state backend (azurerm).
# Create once per RHDP env; the SA must exist before running load.yml.
azure_tf_storage_account: "{{ lookup('ansible.builtin.env', 'AZURE_TF_STORAGE_ACCOUNT') | default('REPLACE_ME_TF_STATE_SA', true) }}"

ado_username: ericcames
ado_pat: "{{ lookup('ansible.builtin.env', 'ADO_PAT') }}"

# Default matches Terraform's admin_username default (demoadmin) so the WinRM
# credential and the VM's local admin line up out of the box.
windows_admin_username: "{{ lookup('ansible.builtin.env', 'WINDOWS_ADMIN_USERNAME') | default('demoadmin', true) }}"
windows_admin_password: "{{ lookup('ansible.builtin.env', 'WINDOWS_ADMIN_PASSWORD') }}"
dc1_azure_default_passwd: "{{ lookup('ansible.builtin.env', 'DC1_AZURE_DEFAULT_PASSWD') }}"

# --- AAP object names (namespaced `DC1.Azure -` per ROADMAP) -----------------
cred_vault: "DC1.Azure - Vault"
cred_azure_rm: "DC1.Azure - Azure RM"
cred_ado_scm: "DC1.Azure - ADO Source Control"
cred_windows: "DC1.Azure - Windows Machine"
cred_controller: "DC1.Azure - Controller"
# Container Registry credential — lets Controller pull DC1.Azure - EE from the
# internal Private Automation Hub registry (ah_hostname). On the AAP 2.5 unified
# platform the Hub registry authenticates with the platform admin credentials,
# so we reuse the same admin user/password the Controller credential uses.
cred_hub_registry: "DC1.Azure - Hub Registry"
# Custom credential — injects dc1_azure_windows_admin_password extra var for
# Terraform in the Provision VM JT. Value sourced from WINDOWS_ADMIN_PASSWORD
# (same env var as cred_windows), so one export covers both credentials.
cred_win_admin_password: "DC1.Azure - Windows Admin Password"
cred_demo_account_password: "DC1.Azure - Demo Account Password"
# ServiceNow callback credential (Phase 8 outbound) — ServiceNow ITSM Credential
# type; injects SN_HOST/SN_USERNAME/SN_PASSWORD for the callback/CMDB/incident JTs.
cred_servicenow: "DC1.Azure - ServiceNow"
hub_registry_host: "{{ ah_hostname }}"
hub_registry_username: "{{ controller_cred_username }}"
hub_registry_password: "{{ controller_cred_password }}"

project_name: "DC1.Azure"
inventory_name: "dc1-azure"
# Control inventory the Teardown JT runs against. The teardown play runs on
# localhost (deregistration hits dc1-azure via the API), so the JT must NOT run
# against dc1-azure itself — AAP locks the hosts of the inventory a running job
# uses, which blocks the JT from deleting the very host it's "running against"
# (AB#73). An empty inventory is sufficient: AWX provides an implicit localhost.
control_inventory_name: "dc1-azure-control"
workflow_name: "DC1.Azure - Provision and Configure"
# Teardown JT name (single source of truth — referenced by the JT definition
# and the nightly teardown schedule) and the schedule object name.
teardown_template: "DC1.Azure - Teardown"
teardown_schedule_name: "DC1.Azure - Nightly Teardown"
# Terraform requires admin_password (12-72 chars) even on `destroy`, but the
# value is never used to destroy an existing VM. The teardown JT bakes this
# NON-SECRET placeholder so scheduled (and manual) teardown runs need no
# password input — and no real secret is committed or stored in AAP. It only
# has to satisfy the length check (terraform validation + teardown.yml assert).
teardown_admin_password_placeholder: "AutoTeardown-Unused-1!"

# --- Reused Windows daily-demo project (pinned git reference, decision 2026-05-26)
# Synced as its own AAP project so the Configure JTs can reuse its proven,
# cloud-agnostic playbooks (powershell_improvement / website_setup /
# windows_account_create / windows_patching) without vendoring.
windows_project_name: "aap.dailydemo.windows"
windows_project_scm_url: "https://github.com/ericcames/aap.dailydemo.windows.git"
windows_project_scm_branch: "v1.0.1"

# --- ADO repo this project syncs from (HTTPS + PAT auth) ---------------------
ado_project_scm_url: "https://dev.azure.com/ericcames/dc1.azure/_git/dc1.azure"

# --- Phase 8: EDA inbound (ServiceNow event-driven trigger) -------------------
# EDA object names (namespaced `DC1.Azure -`). EDA keeps its own credential and
# project stores, separate from the controller_* objects above.
eda_project_name: "DC1.Azure - EDA"
eda_controller_credential: "DC1.Azure - EDA Controller"
eda_snow_event_stream_credential: "DC1.Azure - ServiceNow Event Stream"
eda_event_stream_name: "DC1.Azure - ServiceNow Event Stream"
eda_scm_credential: "DC1.Azure - EDA Source Control"
eda_rulebook_activation_name: "DC1.Azure - Catch ServiceNow Events"
# Decision environment the activation runs in. Reuses the platform's built-in
# DE so we don't have to mint a registry.redhat.io EDA registry credential; the
# stock de-supported image already ships ansible.eda. Override DC1_AZURE_EDA_DE
# if your AAP names its default DE differently.
eda_decision_environment: "{{ lookup('ansible.builtin.env', 'DC1_AZURE_EDA_DE') | default('Default Decision Environment', true) }}"

# The catalog item's short_description — the rulebook matches on this exact
# string. Must equal the ServiceNow catalog item's Short description verbatim.
my_azure_catalog_short_description: "DC1.Azure Windows VM on Azure"

# Shared bearer token: ServiceNow's Outbound REST Message sends it as
# `Authorization: Bearer <token>`; the ServiceNow Event Stream credential
# validates it. Minted once (openssl rand -hex 32) and stored in
# docs/dev-environment.sh — never committed.
eda_event_stream_token: "{{ lookup('ansible.builtin.env', 'EDA_EVENT_STREAM_TOKEN') }}"

# --- Phase 8: ServiceNow callback (outbound) inputs --------------------------
# Consumed by the DC1.Azure - ServiceNow credential. Already populated in
# docs/dev-environment.sh; never committed.
servicenow_instance: "{{ lookup('ansible.builtin.env', 'SN_HOST') }}"
servicenow_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
servicenow_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
