---
# ============================================================================
# Standalone post-load validation wrapper.
# ============================================================================
# Runs the shared checks in validate_tasks.yml under its own short-lived READ
# token (minted from AAP_CONTROLLER_USERNAME/PASSWORD, deleted in always) so it
# can be run independently of load.yml — e.g. to confirm objects after the
# running-EDA-activation workaround (see the running-activation re-apply note).
#
# load.yml does NOT import this wrapper; it imports validate_tasks.yml directly
# under the write token it already holds, so a single token covers the whole
# apply+validate run.
#
# Run standalone:
#   source docs/dev-environment.sh && \
#   ansible-playbook -i aap_config/inventory/ aap_config/validate.yml
# ============================================================================

- name: Verify dc1.azure AAP objects exist
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    # Write scope even though validation only reads: a self-managed token must
    # DELETE itself in always:, and DELETE requires write scope (a read token
    # 403s on self-delete). Matches load.yml + the in-job dance.
    cac_token_scope: write
  tasks:
    - name: Validate under a managed token
      block:
        - name: Acquire a token
          ansible.builtin.import_tasks: tasks/aap_token_acquire.yml

        - name: Assert every expected object exists
          ansible.builtin.import_tasks: validate_tasks.yml
      always:
        - name: Release the token
          ansible.builtin.import_tasks: tasks/aap_token_release.yml
