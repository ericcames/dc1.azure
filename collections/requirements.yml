---
collections:
  # Core Ansible collections (mirrors aap.as.code versions)
  - name: ansible.posix
    version: 2.1.0
  - name: ansible.utils
    version: 6.0.1
  - name: ansible.platform
    version: 2.6.20251106
  - name: ansible.hub
    version: 1.0.4
  - name: ansible.controller
    version: 4.7.8

  # AAP Configuration as Code — pinned to the Automation Hub release
  # (decision 2026-05-26; dc1.azure stands independent of aap.as.code's 4.2.0 pin)
  - name: infra.aap_configuration
    version: 4.4.0

  # Azure-specific (this repo's primary cloud)
  - name: azure.azcollection
    version: 3.0.0

  # Windows post-provision roles run via these collections
  - name: ansible.windows
    version: 3.0.0
  - name: community.windows
    version: 3.0.0

  # ServiceNow callback (Phase 8, AB#83) — the playbooks/servicenow/* callback,
  # CMDB and incident playbooks call servicenow.itsm.* modules, so the EE must
  # carry this collection. 2.13.0 matches the proven aap.dailydemo.windows pin
  # (Hub-available). REQUIRES AN EE REBUILD: after merging, rebuild + push
  # DC1.Azure - EE (see execution-environment.yml) and re-sync it in AAP.
  - name: servicenow.itsm
    version: 2.13.0
