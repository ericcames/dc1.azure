---
# DC1.Azure Execution Environment
# ============================================================
# Adds Terraform to the Red Hat minimal RHEL9 EE base so that the
# Provision VM / Teardown job templates can call `terraform` directly.
#
# BUILD (local):
#   ansible-builder build -f execution-environment.yml \
#                         -t dc1-azure-ee:latest --prune-images
#
# PREREQUISITES:
#   - ansible-builder installed:  pip install ansible-builder
#   - Logged in to Red Hat registry: podman login registry.redhat.io
#   - ~/.ansible.cfg with Automation Hub offline token (see ansible.cfg.example)
#     NOTE: the file must be a real file, not a symlink — ansible-builder's
#     COPY/ADD does not follow symlinks. Fix: cp ~/.ansible/ansible.cfg ~/.ansible.cfg
#
# PUSH (deliberate-update model, AB#95 — see docs/ee-versioning.md):
#   Tag with the NEXT immutable semver tag AND move latest, then push both:
#     podman tag dc1-azure-ee:latest quay.io/zigfreed/dc1-azure-ee:vX.Y.Z
#     podman tag dc1-azure-ee:latest quay.io/zigfreed/dc1-azure-ee:latest
#     podman push quay.io/zigfreed/dc1-azure-ee:vX.Y.Z
#     podman push quay.io/zigfreed/dc1-azure-ee:latest
#   Bump rule: CVE-only rebuild → patch · +collection → minor · new base → major.
#   Then bump `ee_version` in aap_config/group_vars/all.yml and re-apply load.yml;
#   PAH re-syncs the new tag and Controller pulls it once (pull: missing).
#   AAP registration is Config-as-Code (controller_execution_environments.yml) —
#   no manual UI Add needed.
#
# TERRAFORM VERSION:
#   Pinned to 1.15.4 (latest available as of 2026-05).
#   Verify newer releases at: https://releases.hashicorp.com/terraform/
#   Bump the version string in the two RUN lines below when upgrading.
#
# ------------------------------------------------------------
# BUILD PROVENANCE / CHANGE LOG (why this EE looks the way it does)
# ------------------------------------------------------------
# This is the ONLY execution-environment definition in dc1.azure. Record every
# notable change here so the next person knows WHAT is in the image and WHY —
# the image tag alone doesn't explain intent. Collections come from
# collections/requirements.yml (see that file for per-collection rationale).
#
#   Phase 4 (initial) — base ee-minimal-rhel9 + Terraform on PATH so the
#     Provision VM / Teardown JTs can shell out to `terraform`; plus the
#     azure.azcollection / ansible.windows / community.windows / CaC collections
#     the provision + reused Windows configure playbooks need. python3.11-devel +
#     wheel added in the builder stage to compile systemd-python (a transitive
#     dep) into a proper wheel.
#   Phase 8 (AB#83) — added servicenow.itsm (2.13.0) to collections/requirements.yml
#     for the ServiceNow callback/CMDB/incident playbooks (playbooks/servicenow/*).
#     This bumped the EE; rebuild + push and re-sync DC1.Azure - EE in AAP for the
#     callback JTs to run. No Containerfile/base-image change — collections only.
#   2026-06-01 (hardening) — added `microdnf upgrade` as the first prepend_base
#     step to apply OS errata to the base layer at build time, cutting the Quay
#     security-scan CVE count (most Highs — openssl/openssh/libnghttp2 — are base
#     RPMs with fixes published after the 2025-09-21 base cut). Verified the base
#     tag :2.17.14 already resolves to the newest 2.17 rebuild (== 2.17.14-4,
#     digest sha256:4d64d06d…), so there was no fresher in-line base to repin to;
#     the 2.18.x base line (ansible-core minor bump) is deliberately NOT taken
#     here — that compatibility change belongs in its own work item, not a
#     security-hygiene rebuild. No base-image or collection change in this entry.
#     KNOWN RESIDUAL: pyOpenSSL 22.0.0 (a pip dep, NOT an RPM — microdnf can't
#     touch it) remains flagged High. It is required-by azure-cli-core; bumping it
#     to >=26 drags cryptography 37.0.2 -> 48.0.0 under a pinned azure-cli-core
#     that was never tested against it, so it is deliberately NOT forced here. The
#     correct fix is a coherent azure.azcollection bump (its dep tree brings newer
#     pyOpenSSL/cryptography together) — tracked as its own work item.
#   2026-06-03 (AB#95) — adopted the deliberate-update model: images now carry an
#     IMMUTABLE semver tag (vX.Y.Z) and the Controller EE pins to `ee_version`
#     (group_vars/all.yml) with pull: missing instead of the floating :latest +
#     pull: always. v1.0.0 = THIS 2026-06-01 hardened image (quay digest
#     sha256:4423a10…), minted from the existing digest via `skopeo copy` — NO
#     rebuild, identical bits. Versioning/process change only; no image content
#     change. To ship the next version see docs/ee-versioning.md.
# ============================================================

version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel9:2.17.14

dependencies:
  # Path relative to this file — matches the dc1.azure repo layout.
  # Installs all collections in collections/requirements.yml (azure.azcollection,
  # ansible.windows, community.windows, infra.aap_configuration, etc.) along
  # with their Python requirements (pywinrm, azure-mgmt-*, etc.).
  galaxy: collections/requirements.yml

options:
  package_manager_path: /usr/bin/microdnf

# Injects your local ~/.ansible.cfg so ansible-galaxy can authenticate to
# Automation Hub and pull Red Hat certified/validated content during the build.
# This src path is LOCAL to the build machine — it is evaluated at build time
# only and is never committed to the repo.
# See ansible.cfg.example for the required format (two galaxy_server sections:
# rh_certified and rh_validated, each with the same offline token).
additional_build_files:
  - src: /home/eames/.ansible.cfg
    dest: configs

additional_build_steps:
  prepend_base:
    # Apply all available OS errata to the base layer FIRST. The base image is a
    # point-in-time build (2.17.14-4 == :2.17.14, cut 2025-09-21); RHEL/UBI errata
    # published since then (openssl, openssh, libnghttp2, etc.) are not in it. This
    # one step pulls every fix available in the ubi9 repos the base ships with —
    # the single biggest lever on the Quay scan count. (A subset of fixes that live
    # only in fully-entitled RHEL repos won't apply on an unsubscribed build host;
    # those remain until the base line itself republishes.)
    - RUN microdnf upgrade -y --nodocs --setopt=install_weak_deps=0 && microdnf clean all
    # Create /etc/ansible/ so the ADD step below lands correctly
    - RUN mkdir -p /etc/ansible/
    # Install unzip (needed to extract the Terraform archive)
    - RUN microdnf install -y unzip --nodocs --setopt=install_weak_deps=0
    # Download and install Terraform — single-line RUN avoids YAML-folding backslash
    # ambiguity (ansible-builder flattens multiline YAML to one line, turning \ into
    # backslash-space which bash treats as a word, not a line continuation).
    # To upgrade: bump the version string in the URL below.
    - RUN curl -fsSL https://releases.hashicorp.com/terraform/1.15.4/terraform_1.15.4_linux_amd64.zip -o terraform.zip && unzip terraform.zip && mv terraform /usr/local/bin/ && rm terraform.zip
    # Smoke-test: confirm Terraform is on PATH and prints its version
    - RUN terraform --version

  prepend_builder:
    # python3.11-devel provides Python.h for the 3.11 interpreter the EE uses.
    # Required to compile systemd-python (transitive dep: ansible.platform → ansible.eda).
    # Must be python3.11-devel (not python3-devel — that installs Python 3.9 RPM which
    # overwrites /usr/bin/python3 and breaks the build). python3.11-devel does not
    # replace /usr/bin/python3; it only adds /usr/include/python3.11/Python.h.
    # Builder-stage only: final stage starts FROM base (no headers needed there;
    # packages arrive as pre-built wheels from the builder stage).
    - RUN microdnf install -y python3.11-devel --nodocs --setopt=install_weak_deps=0
    # Install the 'wheel' package so pip builds a proper .whl for systemd-python
    # (transitive dep of ansible.eda). Without 'wheel', pip falls back to legacy
    # 'setup.py install' which writes directly into site-packages — no .whl is placed
    # in /output/wheels/, and the final stage then tries to compile from source tarball
    # (failing because pkg-config is absent from the final/base layer).
    - RUN /usr/bin/python3 -m pip install wheel

  prepend_galaxy:
    # Make the Automation Hub cfg available to ansible-galaxy during collection
    # install. The leading dot in .ansible.cfg is preserved by ansible-builder —
    # the file lands at _build/configs/.ansible.cfg (NOT ansible.cfg without dot).
    - ADD _build/configs/.ansible.cfg /etc/ansible/ansible.cfg
