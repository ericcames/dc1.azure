---
# ============================================================================
# playbooks/servicenow/create_ci.yml — Phase 8 (outbound callback)
# ============================================================================
# Registers provisioned VM(s) as ServiceNow CMDB CIs. The CI class is
# OS-conditional: cmdb_ci_win_server (Windows) or cmdb_ci_linux_server (Linux).
# When os_type=both, two CIs are created — one per VM.
# dc1.azure-owned (not the reused Windows role) so we
# can GUARD on ticket_number — non-ServiceNow workflow launches (AAP UI /
# Self-Service / ADO) carry no ticket_number, so this node no-ops and the
# workflow stays green. Mirrors the aap.dailydemo.windows create_configuration_item
# role's module + fields; Azure stand-ins come from provision_vm.yml's set_stats.
#
# Consumed inputs (workflow artifacts from Provision VM via set_stats):
#   my_server         Windows CI name (VM FQDN)     -> name
#   my_public_ip      Windows public IP              -> ip_address
#   my_instance_id    Azure stand-in (vm_name)       -> serial_number (optional)
#   my_instance_type  Azure SKU (vm_size_chosen)     -> other.model_number (optional)
#   linux_fqdn        Linux CI name (VM FQDN)        -> name (os_type=linux|both)
#   linux_public_ip   Linux public IP                -> ip_address (os_type=linux|both)
#   linux_vm_name     Linux vm_name                  -> serial_number (os_type=linux|both)
#
# AB#93 — after registering the CI(s), link them all to the originating
# requested item via the task_ci (Affected CIs) junction table.
#
# Credential: DC1.Azure - ServiceNow (ServiceNow ITSM Credential → SN_* env).
# ============================================================================

- name: Create or update the ServiceNow CMDB CI(s) for the Azure VM(s)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ci_environment: production
    ci_install_status: installed
    ci_operational_status: operational
    ci_category: Hardware
    ci_support_group: "Ansible West Tigers"
    ci_assigned_to: service.ansible

  tasks:
    - name: Register the CI(s) (only on a ServiceNow-driven run)
      when:
        - ticket_number is defined
        - ticket_number | string | length > 0
      block:
        - name: Build the list of VMs to register as CIs
          ansible.builtin.set_fact:
            ci_vms: >-
              {{
                (
                  [{'name': my_server,
                    'ip': my_public_ip | default(''),
                    'instance_id': my_instance_id | default(''),
                    'sku': my_instance_type | default(''),
                    'class': 'cmdb_ci_win_server',
                    'os_label': 'Windows Server'}]
                  if (os_type | default('windows')) in ['windows', 'both'] and my_server is defined
                  else []
                )
                +
                (
                  [{'name': linux_fqdn,
                    'ip': linux_public_ip | default(''),
                    'instance_id': linux_vm_name | default(''),
                    'sku': my_instance_type | default(''),
                    'class': 'cmdb_ci_linux_server',
                    'os_label': 'Linux'}]
                  if (os_type | default('windows')) in ['linux', 'both'] and linux_fqdn is defined
                  else []
                )
              }}

        - name: Create a configuration item for each VM
          register: ci_results
          loop: "{{ ci_vms }}"
          loop_control:
            label: "{{ item.name }} ({{ item.class }})"
          servicenow.itsm.configuration_item:
            name: "{{ item.name }}"
            state: present
            short_description: "Created by the DC1.Azure demo ({{ item.os_label }} on Azure)"
            serial_number: "{{ item.instance_id if item.instance_id else omit }}"
            sys_class_name: "{{ item.class }}"
            assigned_to: "{{ ci_assigned_to }}"
            environment: "{{ ci_environment }}"
            install_status: "{{ ci_install_status }}"
            category: "{{ ci_category }}"
            operational_status: "{{ ci_operational_status }}"
            ip_address: "{{ item.ip if item.ip else omit }}"
            other:
              model_number: "{{ item.sku if item.sku else omit }}"
              assignment_group: "{{ ci_support_group }}"

        - name: Show the CI results
          ansible.builtin.debug:
            msg: "{{ item.item.name }}: sys_id={{ item.record.sys_id }}"
          loop: "{{ ci_results.results }}"
          loop_control:
            label: "{{ item.item.name }}"

        - name: Publish CI sys_id(s) as workflow artifacts
          ansible.builtin.set_stats:
            data:
              vm_ci_sys_id: "{{ ci_results.results[-1].record.sys_id }}"
              vm_ci_count: "{{ ci_results.results | length }}"

        # --- AB#93: relate the originating RITM to the primary CI ---------------
        - name: Use the threaded RITM sys_id when present
          ansible.builtin.set_fact:
            ritm_sys_id: "{{ ticket_sys_id }}"
          when:
            - ticket_sys_id is defined
            - ticket_sys_id | string | length > 0

        - name: Resolve the RITM sys_id by number (fallback)
          when: ritm_sys_id is not defined
          block:
            - name: Query sc_req_item by number
              register: ritm_lookup
              servicenow.itsm.api_info:
                resource: sc_req_item
                sysparm_query: "numberSTARTSWITH{{ ticket_number }}"

            - name: Fail clearly if the RITM was not found
              ansible.builtin.assert:
                that:
                  - ritm_lookup.record | length > 0
                fail_msg: "No sc_req_item matched number '{{ ticket_number }}'."

            - name: Set sys_id from the lookup
              ansible.builtin.set_fact:
                ritm_sys_id: "{{ ritm_lookup.record[0].sys_id }}"

        - name: Link all CIs to the RITM via Affected CIs (task_ci)
          loop: "{{ ci_results.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          servicenow.itsm.api:
            action: post
            resource: task_ci
            data:
              task: "{{ ritm_sys_id }}"
              ci_item: "{{ item.record.sys_id }}"

    - name: Note skip on a non-ServiceNow run
      when: ticket_number is not defined or (ticket_number | string | length == 0)
      ansible.builtin.debug:
        msg: "No ticket_number — non-ServiceNow launch; skipping CMDB CI creation."
