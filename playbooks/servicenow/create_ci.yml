---
# ============================================================================
# playbooks/servicenow/create_ci.yml — Phase 8 (outbound callback)
# ============================================================================
# Registers the provisioned VM as a ServiceNow CMDB CI. The CI class is
# OS-conditional: cmdb_ci_win_server (Windows) or cmdb_ci_linux_server (Linux).
# dc1.azure-owned (not the reused Windows role) so we
# can GUARD on ticket_number — non-ServiceNow workflow launches (AAP UI /
# Self-Service / ADO) carry no ticket_number, so this node no-ops and the
# workflow stays green. Mirrors the aap.dailydemo.windows create_configuration_item
# role's module + fields; Azure stand-ins come from provision_vm.yml's set_stats.
#
# Consumed inputs (workflow artifacts from Provision VM via set_stats):
#   my_server         CI name (VM FQDN)            -> name
#   my_public_ip      public IP                    -> ip_address
#   my_instance_id    Azure stand-in (vm_name)     -> serial_number (optional)
#   my_instance_type  Azure SKU (vm_size_chosen)   -> other.model_number (optional)
#
# AB#93 — after registering the CI, link it back to the originating requested
# item by setting sc_req_item.configuration_item = <CI sys_id>. We patch it HERE
# (not in update_ritm.yml) because the CI sys_id is only known on this branch:
# Create CMDB CI and Update RITM (success) run on SIBLING workflow branches, so a
# set_stats artifact from this node never reaches Update RITM. The CI sys_id is
# captured from the create step; the RITM is resolved from the threaded
# ticket_sys_id (falls back to a number lookup) — same pattern as the start
# notice. We still publish vm_ci_sys_id via set_stats for observability.
#
# Credential: DC1.Azure - ServiceNow (ServiceNow ITSM Credential → SN_* env).
# ============================================================================

- name: Create or update the ServiceNow CMDB CI for the Azure VM
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ci_sys_class_name: "{{ 'cmdb_ci_linux_server' if (os_type | default('windows')) == 'linux' else 'cmdb_ci_win_server' }}"
    ci_environment: production
    ci_install_status: installed
    ci_operational_status: operational
    ci_category: Hardware
    ci_support_group: "Ansible West Tigers"
    ci_assigned_to: service.ansible
    ci_short_description: "Created by the DC1.Azure demo ({{ 'Linux' if (os_type | default('windows')) == 'linux' else 'Windows Server' }} on Azure)"

  tasks:
    - name: Register the CI (only on a ServiceNow-driven run)
      when:
        - ticket_number is defined
        - ticket_number | string | length > 0
      block:
        - name: Create a configuration item
          register: server_info
          servicenow.itsm.configuration_item:
            name: "{{ my_server }}"
            state: present
            short_description: "{{ ci_short_description }}"
            serial_number: "{{ my_instance_id | default(omit) }}"
            sys_class_name: "{{ ci_sys_class_name }}"
            assigned_to: "{{ ci_assigned_to }}"
            environment: "{{ ci_environment }}"
            install_status: "{{ ci_install_status }}"
            category: "{{ ci_category }}"
            operational_status: "{{ ci_operational_status }}"
            ip_address: "{{ my_public_ip | default(omit) }}"
            other:
              model_number: "{{ my_instance_type | default(omit) }}"
              assignment_group: "{{ ci_support_group }}"

        - name: Show the CI result
          ansible.builtin.debug:
            var: server_info.record.sys_id

        - name: Publish the new CI sys_id as a workflow artifact (observability)
          ansible.builtin.set_stats:
            data:
              vm_ci_sys_id: "{{ server_info.record.sys_id }}"

        # --- AB#93: relate the originating RITM to this CI -------------------
        - name: Use the threaded RITM sys_id when present
          ansible.builtin.set_fact:
            ritm_sys_id: "{{ ticket_sys_id }}"
          when:
            - ticket_sys_id is defined
            - ticket_sys_id | string | length > 0

        - name: Resolve the RITM sys_id by number (fallback)
          when: ritm_sys_id is not defined
          block:
            - name: Query sc_req_item by number
              register: ritm_lookup
              servicenow.itsm.api_info:
                resource: sc_req_item
                sysparm_query: "numberSTARTSWITH{{ ticket_number }}"

            - name: Fail clearly if the RITM was not found
              ansible.builtin.assert:
                that:
                  - ritm_lookup.record | length > 0
                fail_msg: "No sc_req_item matched number '{{ ticket_number }}'."

            - name: Set sys_id from the lookup
              ansible.builtin.set_fact:
                ritm_sys_id: "{{ ritm_lookup.record[0].sys_id }}"

        - name: Link the RITM to the new CI (sc_req_item.configuration_item)
          servicenow.itsm.api:
            action: patch
            resource: sc_req_item
            sys_id: "{{ ritm_sys_id }}"
            data:
              configuration_item: "{{ server_info.record.sys_id }}"

    - name: Note skip on a non-ServiceNow run
      when: ticket_number is not defined or (ticket_number | string | length == 0)
      ansible.builtin.debug:
        msg: "No ticket_number — non-ServiceNow launch; skipping CMDB CI creation."
