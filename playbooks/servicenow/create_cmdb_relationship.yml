---
# ============================================================================
# playbooks/servicenow/create_cmdb_relationship.yml — Phase 8 (outbound callback)
# ============================================================================
# Relates the new CMDB CI(s) to the business application they support
# (cmdb_rel_ci, "Uses::Used by"). When os_type=both, creates two relationships
# — one per VM. dc1.azure-owned + guarded on ticket_number so non-ServiceNow
# launches no-op.
#
# Consumed inputs (workflow artifacts): my_server (Windows FQDN),
#   linux_fqdn (Linux FQDN), os_type.
# Credential: DC1.Azure - ServiceNow.
# ============================================================================

- name: Relate the Azure VM CI(s) to the business application
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    rel_resource: cmdb_rel_ci
    rel_child: "Ansible Demonstrations"
    rel_type: "Uses::Used by"

  tasks:
    - name: Create the relationship(s) (only on a ServiceNow-driven run)
      when:
        - ticket_number is defined
        - ticket_number | string | length > 0
      block:
        - name: Build the list of CIs to relate
          ansible.builtin.set_fact:
            rel_servers: >-
              {{
                ([my_server] if (os_type | default('windows')) in ['windows', 'both'] and my_server is defined else [])
                +
                ([linux_fqdn] if (os_type | default('windows')) in ['linux', 'both'] and linux_fqdn is defined else [])
              }}

        - name: Relate each CI to its business application
          loop: "{{ rel_servers }}"
          loop_control:
            label: "{{ item }}"
          servicenow.itsm.api:
            action: post
            resource: "{{ rel_resource }}"
            data:
              child: "{{ rel_child }}"
              parent: "{{ item }}"
              type: "{{ rel_type }}"

    - name: Note skip on a non-ServiceNow run
      when: ticket_number is not defined or (ticket_number | string | length == 0)
      ansible.builtin.debug:
        msg: "No ticket_number — non-ServiceNow launch; skipping CMDB relationship."
