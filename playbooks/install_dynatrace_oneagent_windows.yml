---
# ============================================================================
# playbooks/install_dynatrace_oneagent_windows.yml — Phase 18 (AB#147)
# ============================================================================
# Installs Dynatrace OneAgent on Windows VMs (windemo group). Empty group =
# clean skip. See install_dynatrace_oneagent_linux.yml for the Linux variant.
#
# Required JT credentials:
#   DC1.Azure - Dynatrace       → DT_API_HOST, DT_PAAS_TOKEN
#   DC1.Azure - Windows Machine → WinRM auth
#   DC1.Azure - ServiceNow      → SN_HOST, SN_USERNAME, SN_PASSWORD (snow_log)
# ============================================================================

- name: Install Dynatrace OneAgent (Windows)
  hosts: windemo
  gather_facts: false

  vars:
    dt_api_host: "{{ lookup('ansible.builtin.env', 'DT_API_HOST') }}"
    dt_paas_token: "{{ lookup('ansible.builtin.env', 'DT_PAAS_TOKEN') }}"
    dt_installer_url: "{{ dt_api_host }}/api/v1/deployment/installer/agent/windows/default/latest"
    dt_installer_path: 'C:\Temp\Dynatrace-OneAgent-Windows.exe'

  tasks:
    - name: Assert Dynatrace inputs
      ansible.builtin.assert:
        that:
          - dt_api_host | length > 0
          - dt_paas_token | length > 0
          - dt_host_group | default('') | length > 0
        fail_msg: "DT_API_HOST, DT_PAAS_TOKEN, and dt_host_group are required."

    - name: Check if OneAgent is already installed
      ansible.windows.win_service:
        name: Dynatrace OneAgent
      register: dt_check
      failed_when: false

    - name: Log install check to ServiceNow
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_message: >-
          {{ inventory_hostname }} (Windows): OneAgent service
          {{ 'already running — skipping download.' if dt_check.state is defined
             else 'not found — starting installation.' }}

    - name: Create temp directory
      when: dt_check.state is not defined
      ansible.windows.win_file:
        path: 'C:\Temp'
        state: directory

    - name: Download OneAgent installer
      when: dt_check.state is not defined
      ansible.windows.win_uri:
        url: "{{ dt_installer_url }}"
        headers:
          Authorization: "Api-Token {{ dt_paas_token }}"
        dest: "{{ dt_installer_path }}"
        method: GET
      register: dt_download

    - name: Install OneAgent (silent)
      when: dt_check.state is not defined
      ansible.windows.win_package:
        path: "{{ dt_installer_path }}"
        arguments:
          - --set-host-group={{ dt_host_group }}
          - --set-infra-only=false
        state: present
      register: dt_install

    - name: Log install result to ServiceNow
      when: dt_check.state is not defined
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_message: >-
          {{ inventory_hostname }} (Windows): OneAgent installed successfully
          (host group: {{ dt_host_group }}).

    - name: Set host group via oneagentctl
      ansible.windows.win_command:
        cmd: '"C:\Program Files\dynatrace\oneagent\agent\tools\oneagentctl.exe" --set-host-group={{ dt_host_group }}'
      changed_when: true

    - name: Restart Dynatrace OneAgent to apply host group
      ansible.windows.win_service:
        name: Dynatrace OneAgent
        state: restarted

    - name: Verify Dynatrace OneAgent service
      ansible.windows.win_service:
        name: Dynatrace OneAgent
      register: dt_service
      failed_when: dt_service.state != 'running'

    - name: Clean up installer
      ansible.windows.win_file:
        path: "{{ dt_installer_path }}"
        state: absent

    # --- Audit proof (AB#147) ------------------------------------------------
    - name: Get OneAgent version
      ansible.windows.win_command:
        cmd: '"C:\Program Files\dynatrace\oneagent\agent\tools\oneagentctl.exe" --version'
      register: dt_version
      changed_when: false

    - name: Get server connection info
      ansible.windows.win_command:
        cmd: '"C:\Program Files\dynatrace\oneagent\agent\tools\oneagentctl.exe" --get-server'
      register: dt_server
      changed_when: false

    - name: Log audit proof to ServiceNow
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_message: |
          {{ inventory_hostname }} (Windows) — OneAgent audit proof:
          Version: {{ dt_version.stdout | trim }}
          Server:  {{ dt_server.stdout | trim }}

    - name: Confirm host in Dynatrace tenant
      ansible.builtin.uri:
        url: >-
          {{ dt_api_host }}/api/v2/entities?entitySelector=type(%22HOST%22),
          toRelationships.isNetworkClientOfHost(type(%22HOST%22))&from=now-10m
        headers:
          Authorization: "Api-Token {{ dt_paas_token }}"
        validate_certs: true
      register: dt_host_check
      until: (dt_host_check.json.entities | default([]) | length) > 0
      retries: 6
      delay: 30
      failed_when: false
      delegate_to: localhost
      become: false

    - name: Log tenant verification to ServiceNow
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_message: >-
          {{ inventory_hostname }} (Windows): Dynatrace tenant verification —
          {{ 'host confirmed in tenant ' ~ dt_api_host ~ '.'
             if (dt_host_check.json.entities | default([]) | length) > 0
             else 'host not visible after 3 min of retries.' }}
