---
# ============================================================================
# playbooks/teardown.yml — Phase 4 (+ Phase 16 multi-OS)
# ============================================================================
# Standalone "DC1.Azure - Teardown" job template. Destroys all Azure VMs (and
# all resources Terraform created), removes hosts from the dc1-azure AAP
# inventory, and deletes their host_metrics entries so decommissioned VMs
# stop counting against the Red Hat managed-node subscription.
#
# os_type defaults to "both" so teardown always destroys everything regardless
# of what was provisioned. Terraform handles count=0 on resources that don't
# exist in state (no-op).
#
# Required job-template credentials: DC1.Azure - Azure RM, DC1.Azure - Controller.
# Required inputs: dc1_azure_resource_group, dc1_azure_windows_admin_password
#   (Terraform's admin_password var is required even for destroy; linux-only
#   runs use a placeholder).
# ============================================================================

- name: Tear down the Azure VM(s)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_dir: "{{ playbook_dir }}/../terraform"
    dc1_azure_inventory: "{{ inventory_name | default('dc1-azure') }}"
    dc1_azure_location: "{{ location | default('eastus') }}"
    dc1_azure_admin_username: "{{ admin_username | default('demoadmin') }}"
    dc1_azure_os_type: "{{ os_type | default('both') }}"
    dc1_azure_tf_container: "{{ tf_container | default('tfstate') }}"
    dc1_azure_tf_key: "{{ tf_key | default('dc1.azure.tfstate') }}"
    arm_env:
      ARM_CLIENT_ID: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_ID') }}"
      ARM_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'AZURE_SECRET') }}"
      ARM_SUBSCRIPTION_ID: "{{ lookup('ansible.builtin.env', 'AZURE_SUBSCRIPTION_ID') }}"
      ARM_TENANT_ID: "{{ lookup('ansible.builtin.env', 'AZURE_TENANT') }}"

  environment: "{{ arm_env }}"

  tasks:
    - name: Assert teardown inputs are present
      ansible.builtin.assert:
        that:
          - dc1_azure_resource_group | default('') | length > 0
        fail_msg: >-
          Need dc1_azure_resource_group.

    - name: Assert Windows admin password (required when tearing down Windows)
      ansible.builtin.assert:
        that:
          - dc1_azure_windows_admin_password | default('') | length >= 12
        fail_msg: >-
          dc1_azure_windows_admin_password (>=12 chars) is required when
          os_type includes windows (Terraform validates admin_password even on destroy).
      when: dc1_azure_os_type in ['windows', 'both']

    - name: Set admin password placeholder for linux-only teardown
      ansible.builtin.set_fact:
        dc1_azure_windows_admin_password: "Placeholder-Linux-Only-1!"
      when:
        - dc1_azure_os_type == 'linux'
        - dc1_azure_windows_admin_password is not defined or dc1_azure_windows_admin_password | length == 0

    - name: Initialize Terraform
      ansible.builtin.command:
        cmd: >-
          terraform init -input=false -no-color
          -backend-config="resource_group_name={{ dc1_azure_resource_group }}"
          -backend-config="storage_account_name={{ dc1_azure_tf_storage_account }}"
          -backend-config="container_name={{ dc1_azure_tf_container }}"
          -backend-config="key={{ dc1_azure_tf_key }}"
        chdir: "{{ terraform_dir }}"
      changed_when: false

    - name: Read current Terraform outputs (for host deregistration)
      ansible.builtin.command:
        cmd: terraform output -json
        chdir: "{{ terraform_dir }}"
      changed_when: false
      failed_when: false
      register: tf_output

    - name: Record VM FQDNs before destroy (if state still exists)
      when:
        - tf_output.rc == 0
        - tf_output.stdout | default('') | length > 0
      block:
        - name: Parse Terraform outputs
          ansible.builtin.set_fact:
            _win_inv: "{{ (tf_output.stdout | from_json).windows_inventory.value | default(false, true) }}"
            _linux_inv: "{{ (tf_output.stdout | from_json).linux_inventory.value | default(false, true) }}"

        - name: Extract FQDNs
          ansible.builtin.set_fact:
            win_fqdn: "{{ _win_inv.host | default(omit) }}"
            linux_fqdn: "{{ _linux_inv.host | default(omit) }}"
          when: _win_inv is mapping or _linux_inv is mapping

    # AB#153: open a scoped Dynatrace maintenance window (and close any already-
    # open problems) BEFORE destroy so the VMs vanishing doesn't leave stale
    # "host/process unavailable" problems open forever. Pure DT API — no host
    # access. Gated on DT_API_TOKEN so non-Dynatrace installs still tear down.
    - name: Suppress Dynatrace monitoring for hosts being decommissioned
      ansible.builtin.include_role:
        name: dt_decommission
      vars:
        dt_decommission_host_group: "{{ dt_host_group | default('dc1-azure') }}"
      when: lookup('ansible.builtin.env', 'DT_API_TOKEN') | default('') | length > 0

    - name: Destroy Terraform-managed resources
      ansible.builtin.command:
        cmd: >-
          terraform destroy -input=false -auto-approve -no-color
          -var vm_size_tier={{ vm_size_tier | default('medium-2cpu-8gb') }}
          -var os_type={{ dc1_azure_os_type }}
          -var resource_group_name={{ dc1_azure_resource_group }}
          -var location={{ dc1_azure_location }}
          -var admin_username={{ dc1_azure_admin_username }}
        chdir: "{{ terraform_dir }}"
      environment: >-
        {{ arm_env | combine({'TF_VAR_admin_password': dc1_azure_windows_admin_password}) }}
      no_log: true
      changed_when: true
      register: tf_destroy_result
      ignore_errors: true

    - name: Show Terraform error (if destroy failed)
      when: tf_destroy_result is failed
      ansible.builtin.debug:
        msg: "{{ tf_destroy_result.stderr_lines | default(tf_destroy_result.stderr | default('no stderr') | split('\n')) }}"

    - name: Fail if Terraform destroy failed
      when: tf_destroy_result is failed
      ansible.builtin.fail:
        msg: "terraform destroy exited {{ tf_destroy_result.rc | default('?') }}"

    # AB#153: close-only sweep AFTER destroy — mop up any problem Dynatrace
    # opened in the gap between the window starting and the hosts disappearing.
    # create_window:false so this never opens a new window.
    - name: Sweep any Dynatrace problems opened during teardown (close-only)
      ansible.builtin.include_role:
        name: dt_decommission
      vars:
        dt_decommission_host_group: "{{ dt_host_group | default('dc1-azure') }}"
        dt_decommission_create_window: false
      when: lookup('ansible.builtin.env', 'DT_API_TOKEN') | default('') | length > 0

    - name: Deregister hosts from the AAP inventory
      when: (win_fqdn is defined and win_fqdn is string) or (linux_fqdn is defined and linux_fqdn is string)
      block:
        - name: Mint a short-lived controller token
          ansible.platform.token:
            aap_hostname: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
            aap_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
            aap_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
            aap_validate_certs: false
            description: "dc1.azure teardown host deregistration"
            scope: write
            state: present
          register: td_token

        # Inventory hosts are a Controller resource — ansible.platform (gateway)
        # has no host module, so use ansible.controller.host (matches
        # provision_vm.yml). AB#156.
        - name: Remove the Windows host from the inventory
          ansible.controller.host:
            controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
            controller_oauthtoken: "{{ td_token.ansible_facts.aap_token.token }}"
            validate_certs: false
            name: "{{ win_fqdn }}"
            inventory: "{{ dc1_azure_inventory }}"
            state: absent
          when: win_fqdn is defined and win_fqdn is string

        - name: Remove the Linux host from the inventory
          ansible.controller.host:
            controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
            controller_oauthtoken: "{{ td_token.ansible_facts.aap_token.token }}"
            validate_certs: false
            name: "{{ linux_fqdn }}"
            inventory: "{{ dc1_azure_inventory }}"
            state: absent
          when: linux_fqdn is defined and linux_fqdn is string

        - name: Look up Windows host in host_metrics
          ansible.builtin.uri:
            url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}/api/controller/v2/host_metrics/?hostname={{ win_fqdn }}"
            method: GET
            headers:
              Authorization: "Bearer {{ td_token.ansible_facts.aap_token.token }}"
            validate_certs: false
            status_code: [200, 404]
            return_content: true
          register: win_metrics
          changed_when: false
          failed_when: false
          when: win_fqdn is defined and win_fqdn is string

        - name: Delete Windows host from host_metrics
          ansible.builtin.uri:
            url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}/api/controller/v2/host_metrics/{{ win_metrics.json.results[0].id }}/"
            method: DELETE
            headers:
              Authorization: "Bearer {{ td_token.ansible_facts.aap_token.token }}"
            validate_certs: false
            status_code: [204, 404]
          changed_when: true
          failed_when: false
          when:
            - win_fqdn is defined and win_fqdn is string
            - win_metrics.json.count | default(0) | int > 0

        - name: Look up Linux host in host_metrics
          ansible.builtin.uri:
            url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}/api/controller/v2/host_metrics/?hostname={{ linux_fqdn }}"
            method: GET
            headers:
              Authorization: "Bearer {{ td_token.ansible_facts.aap_token.token }}"
            validate_certs: false
            status_code: [200, 404]
            return_content: true
          register: linux_metrics
          changed_when: false
          failed_when: false
          when: linux_fqdn is defined and linux_fqdn is string

        - name: Delete Linux host from host_metrics
          ansible.builtin.uri:
            url: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}/api/controller/v2/host_metrics/{{ linux_metrics.json.results[0].id }}/"
            method: DELETE
            headers:
              Authorization: "Bearer {{ td_token.ansible_facts.aap_token.token }}"
            validate_certs: false
            status_code: [204, 404]
          changed_when: true
          failed_when: false
          when:
            - linux_fqdn is defined and linux_fqdn is string
            - linux_metrics.json.count | default(0) | int > 0

      always:
        - name: Delete the short-lived controller token
          ansible.platform.token:
            aap_hostname: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
            aap_token: "{{ td_token.ansible_facts.aap_token.token }}"
            aap_validate_certs: false
            existing_token: "{{ td_token.ansible_facts.aap_token }}"
            state: absent
          when:
            - td_token is defined
            - td_token.ansible_facts is defined
