---
# ============================================================================
# playbooks/install_dynatrace_oneagent_linux.yml — Phase 18 (AB#147)
# ============================================================================
# Installs Dynatrace OneAgent on Linux VMs (linuxweb group). Empty group =
# clean skip. See install_dynatrace_oneagent_windows.yml for the Windows
# variant.
#
# Required JT credentials:
#   DC1.Azure - Dynatrace      → DT_API_HOST, DT_PAAS_TOKEN
#   DC1.Azure - Linux Machine  → SSH auth
#   DC1.Azure - ServiceNow     → SN_HOST, SN_USERNAME, SN_PASSWORD (snow_log)
# ============================================================================

- name: Install Dynatrace OneAgent (Linux)
  hosts: linuxweb
  become: true
  gather_facts: false

  vars:
    dt_api_host: "{{ lookup('ansible.builtin.env', 'DT_API_HOST') }}"
    dt_paas_token: "{{ lookup('ansible.builtin.env', 'DT_PAAS_TOKEN') }}"
    dt_installer_url: "{{ dt_api_host }}/api/v1/deployment/installer/agent/unix/default/latest"
    dt_installer_path: /tmp/Dynatrace-OneAgent-Linux.sh

  tasks:
    - name: Assert Dynatrace inputs
      ansible.builtin.assert:
        that:
          - dt_api_host | length > 0
          - dt_paas_token | length > 0
          - dt_host_group | default('') | length > 0
        fail_msg: "DT_API_HOST, DT_PAAS_TOKEN, and dt_host_group are required."

    - name: Check if OneAgent is already installed
      ansible.builtin.stat:
        path: /opt/dynatrace/oneagent/agent/tools/oneagentctl
      register: dt_installed

    - name: Log install check to ServiceNow
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_message: >-
          {{ inventory_hostname }} (Linux): OneAgent
          {{ 'already installed — skipping download.' if dt_installed.stat.exists
             else 'not found — starting installation.' }}

    - name: Download OneAgent installer
      when: not dt_installed.stat.exists
      ansible.builtin.uri:
        url: "{{ dt_installer_url }}"
        headers:
          Authorization: "Api-Token {{ dt_paas_token }}"
        dest: "{{ dt_installer_path }}"
        mode: "0755"
        status_code: [200]
      register: dt_download

    - name: Install OneAgent
      when: not dt_installed.stat.exists
      ansible.builtin.command:
        argv:
          - /bin/sh
          - "{{ dt_installer_path }}"
          - "--set-host-group={{ dt_host_group }}"
          - --set-infra-only=false
        creates: /opt/dynatrace/oneagent/agent/tools/oneagentctl
      register: dt_install

    - name: Log install result to ServiceNow
      when: not dt_installed.stat.exists
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_message: >-
          {{ inventory_hostname }} (Linux): OneAgent installed successfully
          (host group: {{ dt_host_group }}).

    - name: Verify oneagent service
      ansible.builtin.service:
        name: oneagent
        state: started
      register: dt_service

    - name: Clean up installer
      ansible.builtin.file:
        path: "{{ dt_installer_path }}"
        state: absent

    # --- Audit proof (AB#147) ------------------------------------------------
    - name: Get OneAgent version
      ansible.builtin.command:
        cmd: /opt/dynatrace/oneagent/agent/tools/oneagentctl --version
      register: dt_version
      changed_when: false

    - name: Get server connection info
      ansible.builtin.command:
        cmd: /opt/dynatrace/oneagent/agent/tools/oneagentctl --get-server
      register: dt_server
      changed_when: false

    - name: Log audit proof to ServiceNow
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_message: |
          {{ inventory_hostname }} (Linux) — OneAgent audit proof:
          Version: {{ dt_version.stdout | trim }}
          Server:  {{ dt_server.stdout | trim }}

    - name: Confirm host in Dynatrace tenant
      ansible.builtin.uri:
        url: >-
          {{ dt_api_host }}/api/v2/entities?entitySelector=type(%22HOST%22),
          toRelationships.isNetworkClientOfHost(type(%22HOST%22))&from=now-10m
        headers:
          Authorization: "Api-Token {{ dt_paas_token }}"
        validate_certs: true
      register: dt_host_check
      until: (dt_host_check.json.entities | default([]) | length) > 0
      retries: 6
      delay: 30
      failed_when: false
      delegate_to: localhost
      become: false

    - name: Log tenant verification to ServiceNow
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_message: >-
          {{ inventory_hostname }} (Linux): Dynatrace tenant verification —
          {{ 'host confirmed in tenant ' ~ dt_api_host ~ '.'
             if (dt_host_check.json.entities | default([]) | length) > 0
             else 'host not visible after 3 min of retries.' }}
