---
# ============================================================================
# playbooks/provision_vm.yml — Phase 4 (+ Phase 8 SNow + Phase 16 multi-OS)
# ============================================================================
# First node of the "DC1.Azure - Provision and Configure" workflow. Runs the
# Azure Terraform, then registers the new VM(s) into the dc1-azure AAP
# inventory so the separate Configure workflow nodes find them:
#   - Windows → `windemo` group (WinRM connection vars)
#   - Linux   → `linuxweb` group (SSH connection vars)
#
# The `os_type` survey variable (windows | linux | both) controls which VMs
# are created. Default is `windows` for backward compatibility.
#
# Linux VMs use SSH key auth: Terraform generates the key pair
# (tls_private_key) and this playbook creates/updates the
# `DC1.Azure - Linux Machine` credential with the generated private key.
#
# Required job-template credentials:
#   - DC1.Azure - Azure RM        → injects AZURE_* env vars (mapped to ARM_*)
#   - DC1.Azure - Controller      → injects CONTROLLER_* for inventory registration
#   - DC1.Azure - Vault           → decrypts the vaulted admin-password var
#
# Required inputs (survey / extra_vars / vaulted vars):
#   - vm_size_tier                       small-2cpu-4gb | medium-2cpu-8gb | large-4cpu-16gb
#   - os_type                            windows | linux | both (default: windows)
#   - dc1_azure_resource_group           RHDP resource group (JT extra_var)
#   - dc1_azure_windows_admin_password   sensitive; required when os_type includes windows
# ============================================================================

- name: Provision Azure VM(s) and register for configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_dir: "{{ playbook_dir }}/../terraform"
    dc1_azure_inventory: "{{ inventory_name | default('dc1-azure') }}"
    dc1_azure_group: windemo
    dc1_azure_linux_group: linuxweb
    dc1_azure_location: "{{ location | default('eastus') }}"
    dc1_azure_admin_username: "{{ admin_username | default('demoadmin') }}"
    dc1_azure_os_type: "{{ os_type | default('windows') }}"
    dc1_azure_tf_container: "{{ tf_container | default('tfstate') }}"
    dc1_azure_tf_key: "{{ tf_key | default('dc1.azure.tfstate') }}"
    arm_env:
      ARM_CLIENT_ID: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_ID') }}"
      ARM_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'AZURE_SECRET') }}"
      ARM_SUBSCRIPTION_ID: "{{ lookup('ansible.builtin.env', 'AZURE_SUBSCRIPTION_ID') }}"
      ARM_TENANT_ID: "{{ lookup('ansible.builtin.env', 'AZURE_TENANT') }}"

  environment: "{{ arm_env }}"

  tasks:
    - name: Provision the VM(s) and register (capture failures for ServiceNow)
      block:
        - name: Assert provisioning inputs are present
          ansible.builtin.assert:
            that:
              - vm_size_tier | default('') in ['small-2cpu-4gb', 'medium-2cpu-8gb', 'large-4cpu-16gb']
              - dc1_azure_os_type in ['windows', 'linux', 'both']
              - dc1_azure_resource_group | default('') | length > 0
            fail_msg: >-
              Need vm_size_tier (small-2cpu-4gb|medium-2cpu-8gb|large-4cpu-16gb),
              os_type (windows|linux|both), and dc1_azure_resource_group.

        - name: Assert Windows admin password (required when provisioning Windows)
          ansible.builtin.assert:
            that:
              - dc1_azure_windows_admin_password | default('') | length >= 12
            fail_msg: >-
              dc1_azure_windows_admin_password (>=12 chars) is required when
              os_type includes windows.
          when: dc1_azure_os_type in ['windows', 'both']

        - name: Set admin password placeholder for linux-only runs
          ansible.builtin.set_fact:
            dc1_azure_windows_admin_password: "Placeholder-Linux-Only-1!"
          when:
            - dc1_azure_os_type == 'linux'
            - dc1_azure_windows_admin_password is not defined or dc1_azure_windows_admin_password | length == 0

        - name: Assert the Red Hat AAP (Controller) credential is attached
          ansible.builtin.assert:
            that:
              - lookup('ansible.builtin.env', 'CONTROLLER_HOST') | length > 0
              - lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') | length > 0
              - lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') | length > 0
            fail_msg: >-
              Attach the 'DC1.Azure - Controller' (Red Hat Ansible Automation
              Platform) credential to this job template.

        - name: Initialize Terraform
          ansible.builtin.command:
            cmd: >-
              terraform init -input=false -no-color
              -backend-config="resource_group_name={{ dc1_azure_resource_group }}"
              -backend-config="storage_account_name={{ dc1_azure_tf_storage_account }}"
              -backend-config="container_name={{ dc1_azure_tf_container }}"
              -backend-config="key={{ dc1_azure_tf_key }}"
            chdir: "{{ terraform_dir }}"
          changed_when: false

        - name: Apply Terraform (create the VM(s))
          ansible.builtin.command:
            cmd: >-
              terraform apply -input=false -auto-approve -no-color
              -var vm_size_tier={{ vm_size_tier }}
              -var os_type={{ dc1_azure_os_type }}
              -var resource_group_name={{ dc1_azure_resource_group }}
              -var location={{ dc1_azure_location }}
              -var admin_username={{ dc1_azure_admin_username }}
            chdir: "{{ terraform_dir }}"
          environment: >-
            {{ arm_env | combine({
              'TF_VAR_admin_password': dc1_azure_windows_admin_password,
              'TF_VAR_linux_ssh_public_key': dc1_azure_linux_ssh_public_key | default('unused-no-linux', true)
            }) }}
          no_log: true
          changed_when: true
          register: tf_apply_result
          ignore_errors: true

        - name: Show Terraform error (if apply failed)
          when: tf_apply_result is failed
          ansible.builtin.debug:
            msg: "{{ tf_apply_result.stderr_lines | default(tf_apply_result.stderr | default('no stderr') | split('\n')) }}"

        - name: Fail if Terraform apply failed
          when: tf_apply_result is failed
          ansible.builtin.fail:
            msg: "terraform apply exited {{ tf_apply_result.rc | default('?') }}"

        - name: Read Terraform outputs
          ansible.builtin.command:
            cmd: terraform output -json
            chdir: "{{ terraform_dir }}"
          changed_when: false
          register: tf_output

        - name: Parse per-OS inventory outputs
          ansible.builtin.set_fact:
            win_inventory: "{{ (tf_output.stdout | from_json).windows_inventory.value | default(false, true) }}"
            linux_inventory: "{{ (tf_output.stdout | from_json).linux_inventory.value | default(false, true) }}"

        - name: Register VM(s) in AAP and publish workflow artifacts
          block:
            - name: Mint a short-lived controller token
              ansible.platform.token:
                aap_hostname: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
                aap_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
                aap_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
                aap_validate_certs: false
                description: "dc1.azure provision_vm inventory registration"
                scope: write
                state: present
              register: prov_token

            # --- Ensure both inventory groups always exist -----------------------
            # Both groups are created unconditionally so workflow nodes with
            # limit: windemo / linuxweb always resolve (empty group = no-op,
            # missing group = job failure).
            - name: Ensure the windemo group exists (with WinRM connection vars)
              ansible.controller.group:
                controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
                controller_oauthtoken: "{{ prov_token.ansible_facts.aap_token.token }}"
                validate_certs: false
                name: "{{ dc1_azure_group }}"
                inventory: "{{ dc1_azure_inventory }}"
                state: present
                variables:
                  ansible_connection: winrm
                  ansible_port: 5986
                  ansible_winrm_transport: ntlm
                  ansible_winrm_server_cert_validation: ignore

            - name: Ensure the linuxweb group exists (with SSH connection vars)
              ansible.controller.group:
                controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
                controller_oauthtoken: "{{ prov_token.ansible_facts.aap_token.token }}"
                validate_certs: false
                name: "{{ dc1_azure_linux_group }}"
                inventory: "{{ dc1_azure_inventory }}"
                state: present
                variables:
                  ansible_connection: ssh
                  ansible_port: 22

            # --- Windows host registration --------------------------------------
            - name: Register Windows VM in AAP
              when: win_inventory is mapping
              block:
                - name: Add the Windows VM as a host
                  ansible.controller.host:
                    controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
                    controller_oauthtoken: "{{ prov_token.ansible_facts.aap_token.token }}"
                    validate_certs: false
                    name: "{{ win_inventory.host }}"
                    inventory: "{{ dc1_azure_inventory }}"
                    enabled: true
                    state: present
                    variables:
                      ansible_host: "{{ win_inventory.ansible_host }}"
                      vm_name: "{{ win_inventory.vm_name }}"
                      vm_size_chosen: "{{ win_inventory.vm_size_chosen }}"

                - name: Associate the Windows host with the windemo group
                  ansible.controller.group:
                    controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
                    controller_oauthtoken: "{{ prov_token.ansible_facts.aap_token.token }}"
                    validate_certs: false
                    name: "{{ dc1_azure_group }}"
                    inventory: "{{ dc1_azure_inventory }}"
                    hosts:
                      - "{{ win_inventory.host }}"
                    state: present

            # --- Linux host registration ----------------------------------------
            - name: Register Linux VM in AAP
              when: linux_inventory is mapping
              block:
                - name: Add the Linux VM as a host
                  ansible.controller.host:
                    controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
                    controller_oauthtoken: "{{ prov_token.ansible_facts.aap_token.token }}"
                    validate_certs: false
                    name: "{{ linux_inventory.host }}"
                    inventory: "{{ dc1_azure_inventory }}"
                    enabled: true
                    state: present
                    variables:
                      ansible_host: "{{ linux_inventory.ansible_host }}"
                      vm_name: "{{ linux_inventory.vm_name }}"
                      vm_size_chosen: "{{ linux_inventory.vm_size_chosen }}"

                - name: Associate the Linux host with the linuxweb group
                  ansible.controller.group:
                    controller_host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
                    controller_oauthtoken: "{{ prov_token.ansible_facts.aap_token.token }}"
                    validate_certs: false
                    name: "{{ dc1_azure_linux_group }}"
                    inventory: "{{ dc1_azure_inventory }}"
                    hosts:
                      - "{{ linux_inventory.host }}"
                    state: present

            # --- Workflow artifacts (set_stats) ----------------------------------
            - name: Pick the primary inventory for set_stats
              ansible.builtin.set_fact:
                _primary: "{{ win_inventory if (win_inventory is mapping) else linux_inventory }}"

            - name: Pass provisioning details to the rest of the workflow
              ansible.builtin.set_stats:
                data:
                  os_type: "{{ dc1_azure_os_type }}"
                  vm_public_ip: "{{ _primary.ansible_host }}"
                  vm_fqdn: "{{ _primary.host }}"
                  vm_name: "{{ _primary.vm_name }}"
                  vm_size_chosen: "{{ _primary.vm_size_chosen }}"
                  vm_admin_username: "{{ dc1_azure_admin_username }}"
                  my_server: "{{ _primary.host }}"
                  my_public_ip: "{{ _primary.ansible_host }}"
                  my_instance_id: "{{ _primary.vm_name }}"
                  my_instance_type: "{{ _primary.vm_size_chosen }}"

            - name: Publish Linux-specific artifacts
              ansible.builtin.set_stats:
                data:
                  linux_public_ip: "{{ linux_inventory.ansible_host }}"
                  linux_fqdn: "{{ linux_inventory.host }}"
                  linux_vm_name: "{{ linux_inventory.vm_name }}"
              when: linux_inventory is mapping

          always:
            - name: Delete the short-lived controller token
              ansible.platform.token:
                aap_hostname: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
                aap_token: "{{ prov_token.ansible_facts.aap_token.token }}"
                aap_validate_certs: false
                existing_token: "{{ prov_token.ansible_facts.aap_token }}"
                state: absent
              when:
                - prov_token is defined
                - prov_token.ansible_facts is defined

      rescue:
        - name: Capture the failure for the ServiceNow incident path
          ansible.builtin.set_stats:
            data:
              vm_my_error: "{{ ansible_failed_result.msg | default('provisioning failed') }}"
              vm_my_job_id: "{{ tower_job_id | default(awx_job_id | default('n/a')) }}"
              vm_my_job_template_name: >-
                {{ tower_job_template_name | default(awx_job_template_name | default('DC1.Azure - Provision VM')) }}

        - name: Re-fail so the workflow takes its failure path
          ansible.builtin.fail:
            msg: "Provisioning failed; failure details captured for the ServiceNow incident node."
