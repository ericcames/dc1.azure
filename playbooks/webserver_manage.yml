---
# ============================================================================
# playbooks/webserver_manage.yml — Phase 19 (service lifecycle management)
# ============================================================================
# Manages web service state on Linux (httpd) and/or Windows (IIS/W3SVC).
# Used by the "DC1.Azure - Break Website" JT and by the remediation workflow.
#
# Survey / extra_vars:
#   webserver_manage_action  — break | restart | verify | status
#
# The JT's limit controls which hosts are targeted. The role auto-detects
# OS via group membership (linuxweb → httpd, windemo → W3SVC).
# ============================================================================

- name: Manage web service (Linux)
  hosts: linuxweb
  gather_facts: false
  become: true

  roles:
    - role: webserver_manage

- name: Manage web service (Windows)
  hosts: windemo
  gather_facts: false

  roles:
    - role: webserver_manage
