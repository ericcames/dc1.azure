---
# ============================================================================
# DEPRECATED — TRANSITIONAL STOPGAP. DO NOT EXTEND.
# ============================================================================
# This playbook will be removed once `aap_config/load.yml` is verified
# end-to-end. The canonical install path going forward is the self-contained
# `aap_config/` directory dispatched via `infra.aap_configuration.dispatch`
# — see ROADMAP.md Phase 3 (restructure decision dated 2026-05-21).
#
# Why this playbook still exists today:
#   - `aap_config/` has not been built yet
#   - This file already creates Vault + Azure RM credentials successfully
#     against live RHDP AAP, so it's the only working partial bootstrap path
#   - It handles the "no AAP token yet, only admin password" first-run case
#     via `ansible.platform.token` lifecycle, which `aap_config/load.yml`
#     does not (load.yml requires a user-created personal token)
#
# When to remove this file:
#   - After `aap_config/load.yml` produces every dc1.azure AAP object
#     end-to-end against a fresh RHDP AAP
#   - After `docs/INSTALL.md` (Phase 7) covers the personal-token creation
#     step the CaC path requires
#
# Any new AAP objects (Windows machine credential, dc1-azure inventory,
# provision/configure/teardown JTs with surveys, Provision-and-Configure
# workflow) go in `aap_config/files/controller_*.yml` — NOT here.
# ============================================================================
#
# Phase 3 bootstrap — DC1.Azure objects in AAP (transitional).
#
# Creates the minimum AAP objects needed to drive the dc1.azure demo from
# the ADO-hosted repo: Vault credential, Azure RM credential, ADO Source
# Control credential, and the DC1.Azure project that syncs from the ADO
# repo.
#
# Pattern mirrors aap.as.code/playbooks/bootstrap_dev.yml — uses
# ansible.platform.token for token lifecycle (created + deleted in
# always: block so stale tokens don't accumulate) and ansible.controller
# modules for the credential/project objects (ansible.platform doesn't
# yet provide equivalents).
#
# All variables are resolved at runtime via env-var / file lookups in
# inventories/dc1-azure/group_vars/all.yml — no secrets in this file.
#
# Run with:
#   export CONTROLLER_HOST=<aap url from docs/dev-environment.md>
#   export CONTROLLER_USERNAME=admin
#   export CONTROLLER_PASSWORD=<aap admin password>
#   export AZURE_SUBSCRIPTION_ID=...
#   export AZURE_TENANT_ID=...
#   export AZURE_CLIENT_ID=...
#   export AZURE_CLIENT_SECRET=...
#   export ADO_PAT=<azure devops PAT>
#   ansible-playbook -i inventories/dc1-azure/ playbooks/bootstrap_aap.yml

- name: Bootstrap AAP — DC1.Azure
  hosts: all
  gather_facts: false

  tasks:

    - name: Assert controller environment variables are set
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_username | length > 0
          - aap_password | length > 0
        fail_msg:
          - "AAP controller credentials are not set."
          - "Run: export CONTROLLER_HOST / CONTROLLER_USERNAME / CONTROLLER_PASSWORD"

    - name: Assert Azure Service Principal variables are set
      ansible.builtin.assert:
        that:
          - azure_subscription_id | length > 0
          - azure_tenant_id | length > 0
          - azure_client_id | length > 0
          - azure_client_secret | length > 0
        fail_msg:
          - "Azure SP variables are not set."
          - "Run: export AZURE_SUBSCRIPTION_ID / AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET"

    - name: Assert ADO PAT is set
      tags: ado
      ansible.builtin.assert:
        that:
          - ado_pat | length > 0
        fail_msg:
          - "ADO Personal Access Token is not set."
          - "Run: export ADO_PAT=<your PAT>"
          - "Or skip ADO tasks with: --skip-tags ado"

    - name: Create bootstrap token
      ansible.platform.token:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"
        description: "dc1.azure bootstrap token"
        scope: write
        state: present
      register: bootstrap_token

    - name: Run bootstrap tasks
      block:

        - name: Create Vault credential
          ansible.controller.credential:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "{{ cred_vault }}"
            organization: "{{ my_organization }}"
            credential_type: "Vault"
            inputs:
              vault_password: "{{ vault_password }}"
            state: present

        - name: Create Azure RM credential (Service Principal auth)
          ansible.controller.credential:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "{{ cred_azure_rm }}"
            organization: "{{ my_organization }}"
            credential_type: "Microsoft Azure Resource Manager"
            inputs:
              subscription: "{{ azure_subscription_id }}"
              tenant: "{{ azure_tenant_id }}"
              client: "{{ azure_client_id }}"
              secret: "{{ azure_client_secret }}"
            state: present

        - name: Create ADO Source Control credential (PAT auth)
          # ADO PATs are sent as basic-auth password; username is any non-empty
          # string. AAP's project sync will use this credential to fetch the
          # dc1.azure repo over HTTPS.
          tags: ado
          ansible.controller.credential:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "{{ cred_ado_scm }}"
            organization: "{{ my_organization }}"
            credential_type: "Source Control"
            inputs:
              username: ericcames
              password: "{{ ado_pat }}"
            state: present

        - name: Create DC1.Azure project (synced from ADO repo)
          tags: ado
          ansible.controller.project:
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            name: "{{ project_name }}"
            organization: "{{ my_organization }}"
            scm_type: git
            scm_url: "{{ ado_project_scm_url }}"
            scm_branch: main
            scm_credential: "{{ cred_ado_scm }}"
            scm_update_on_launch: true
            wait: true
            state: present

      always:

        - name: Delete bootstrap token
          ansible.platform.token:
            aap_hostname: "{{ aap_hostname }}"
            aap_token: "{{ bootstrap_token.ansible_facts.aap_token.token }}"
            aap_validate_certs: "{{ aap_validate_certs }}"
            existing_token: "{{ bootstrap_token.ansible_facts.aap_token }}"
            state: absent
